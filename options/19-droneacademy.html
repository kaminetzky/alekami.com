<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03050f">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#03050f;color:#eaf1ff;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(16px,env(safe-area-inset-top)) clamp(16px,3vw,36px) max(16px,env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
h1{margin:0;font-size:clamp(14px,1.5vw,20px);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.role{margin:4px 0 0;font-size:12px;color:#8fa6d8}
.stats{font-size:12px;min-width:210px;background:#03050fb8;border:1px solid #ffffff22;padding:9px 11px}
.stats div{display:flex;justify-content:space-between;gap:14px;line-height:1.6}
.stats b{color:#4affc3;font-weight:700}
#spark{display:block;width:100%;height:30px;margin-top:4px}
.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
#cap{font-size:clamp(13px,1.4vw,18px);letter-spacing:.14em;text-transform:uppercase;color:#ffd166;min-height:1.4em}
.links{display:flex;gap:10px;pointer-events:auto}
a{color:#03050f;background:#4affc3;padding:11px 18px;text-decoration:none;font-weight:700;font-size:13px}
a+a{background:#ff5ca8}
a:hover,a:focus-visible{background:#fff}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="A fleet of simulated drones, flown by one neural network, forming this person's name"></canvas>
<div class="ui">
  <div class="top">
    <div><h1 id="name"></h1><p class="role" id="role"></p></div>
    <div class="stats">
      <div><span>GENERATION</span><b id="gen">0</b></div>
      <div><span>POSITION ERROR</span><b id="err">--</b></div>
      <div><span>BODIES / BRAINS</span><b id="bb">0 / 1</b></div>
      <canvas id="spark"></canvas>
    </div>
  </div>
  <div class="foot">
    <div id="cap" aria-live="off"></div>
    <div class="links"><a id="gh" rel="me noopener">GitHub</a><a id="li" rel="me noopener">LinkedIn</a></div>
  </div>
</div>
<script src="../config.js"></script>
<script src="shapes.js"></script>
<script src="drone-sim.js"></script>
<script>
{
const S = SITE, D = DRONE, $ = id => document.getElementById(id);
$("name").textContent = S.full; $("role").textContent = "One neural net, learning to fly right now.";
$("gh").href = S.github; $("li").href = S.linkedin;
const c = $("c"), x = c.getContext("2d", { alpha: false });
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const tier = S.tier(), small = Math.min(innerWidth, innerHeight) < 600;
const N = [320, 600, small ? 800 : 1500][tier];
$("bb").textContent = N + " / 1";
let W, H, dpr, pxm, halfX, shapes = [];
const drones = [];
const VIEW_H = 10; // metres of sky shown top to bottom

function sample(paint, boxW, boxH, yMid) {
  const mw = 700, mh = Math.round(mw * boxH / boxW), m = document.createElement("canvas"); m.width = mw; m.height = mh;
  const g = m.getContext("2d", { willReadFrequently: true });
  paint(g, mw, mh);
  const d = g.getImageData(0, 0, mw, mh).data;
  // Pick the grid spacing with as many spots as drones without going over, so every spot gets a drone
  // (a denser grid with spots dropped at random left holes). The few spare drones double up on spots.
  const grid = step => { const list = []; for (let y = step / 2; y < mh; y += step) for (let a = step / 2; a < mw; a += step) if (d[((y | 0) * mw + (a | 0)) * 4 + 3] > 120) list.push([(a / mw - .5) * boxW, (.5 - y / mh) * boxH + yMid]); return list; };
  let lo = 1.5, hi = 24;
  for (let i = 0; i < 24; i++) { const mid = (lo + hi) / 2; if (grid(mid).length > N) lo = mid; else hi = mid; }
  const list = grid(hi);
  for (let i = list.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0, t = list[i]; list[i] = list[j]; list[j] = t; }
  const out = [];
  for (let i = 0; i < N; i++) out.push(list[i % list.length]);
  return out.sort((a, b) => a[0] - b[0]);
}
const words = lines => (g, w, h) => {
  const face = '900 100px "Arial Black","Helvetica Neue",Arial,sans-serif';
  g.font = face;
  const widest = Math.max(...lines.map(l => g.measureText(l).width));
  const size = Math.min(100 * w * .97 / widest, h * .94 / lines.length);
  g.font = face.replace("100px", size + "px");
  g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = "#fff";
  lines.forEach((l, i) => g.fillText(l, w / 2, h / 2 + (i - (lines.length - 1) / 2) * size * 1.03));
};
const art = (key, lw) => (g, w, h) => {
  const sh = SHAPES[key], s = Math.min(w / sh.w, h / sh.h) * .92;
  g.translate((w - sh.w * s) / 2, (h - sh.h * s) / 2); g.scale(s, s);
  g.strokeStyle = "#fff"; g.lineWidth = lw; g.lineCap = g.lineJoin = "round"; g.stroke(new Path2D(sh.d));
};
function buildShapes() {
  const narrow = W / H < 1, bw = halfX * 2 * (narrow ? .86 : .94), bh = narrow ? 4.2 : 4.6, y = narrow ? .55 : .3;
  const two = (a, b) => words(narrow || a.length + b.length > 15 ? [a, b] : [a + " " + b]);
  shapes = [
    { cap: "", pts: sample(words(narrow ? S.lines(true) : [S.first.toUpperCase(), S.last.toUpperCase()]), bw, bh, y), hue: [.55, .9, 1], hold: 9 },
    { cap: "Machine learning", pts: sample(art("net", 3), bw, bh, y), hue: [1, .4, .75], hold: 6 },
    { cap: "Software", pts: sample(words(["</>"]), bw, bh, y), hue: [.5, .65, 1], hold: 6 },
    { cap: "Electrical", pts: sample(art("chip", 5), bw, bh, y), hue: [1, .85, .35], hold: 6 },
    { cap: "Private pilot", pts: sample(art("jet", 4.5), bw, bh, y), hue: [1, .7, .3], hold: 6 },
    { cap: "Drones", pts: sample(art("drone", 5), bw, bh, y), hue: [.3, 1, .6], hold: 6 },
  ];
}
function spawn(d, i) {
  d.x = -halfX + (i + .5) / N * halfX * 2; d.y = -VIEW_H / 2 + .25; d.vx = d.vy = d.a = d.w = 0;
}
function layout() {
  W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio || 1, tier === 2 ? 1.5 : 1);
  c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
  pxm = H / VIEW_H; halfX = W / pxm / 2;
  x.fillStyle = "#03050f"; x.fillRect(0, 0, W, H);
  buildShapes();
  if (!drones.length) for (let i = 0; i < N; i++) { const d = { r: .55, g: .9, b: 1, s: Math.random() }; spawn(d, i); drones.push(d); }
  assign(shapes[shapeIndex]);
}
let shapeIndex = 0;
function assign(sh) {
  const order = drones.map((_, i) => i).sort((a, b) => drones[a].x - drones[b].x);
  order.forEach((di, k) => { const d = drones[di]; d.tx = sh.pts[k][0]; d.ty = sh.pts[k][1]; });
  $("cap").textContent = sh.cap;
}

// A live training run in a worker. Each generation's best brain flies everybody at once.
let brain = null, trained = false, errs = [], cycleAt = 0, clock = 0, sleeping = false, lastPoke = 0;
const worker = new Worker("drone-sim.js");
worker.onmessage = ({ data }) => {
  brain = data.best;
  $("gen").textContent = data.gen;
  $("err").textContent = data.err > 50 ? "CRASHING" : data.err.toFixed(2) + " m";
  errs.push(Math.min(data.err, 12)); drawSpark();
  if (data.done) { trained = true; worker.terminate(); cycleAt = clock + 5; $("role").textContent = "Training complete. Move your pointer to push them around."; }
};
function drawSpark() {
  const sp = $("spark"), r = sp.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
  if (!r.width) return;
  if (sp.width !== (r.width * d | 0)) { sp.width = r.width * d; sp.height = r.height * d; }
  const g = sp.getContext("2d"); g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, r.width, r.height);
  g.strokeStyle = "#4affc3"; g.lineWidth = 1.5; g.beginPath();
  errs.forEach((e, i) => { const px = i / Math.max(150, errs.length) * r.width, py = 2 + (1 - Math.log1p(e) / Math.log1p(12)) * (r.height - 4); i ? g.lineTo(px, py) : g.moveTo(px, py); });
  g.stroke();
}
let px = 1e9, py = 1e9;
addEventListener("pointermove", e => { px = (e.clientX - W / 2) / pxm; py = (H / 2 - e.clientY) / pxm; lastPoke = clock; sleeping = false; }, { passive: true });

let last = 0, stepClock = 0, cycleDone = false, cycleStep = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = t; return; }
  const dt = Math.min(.05, (t - last) / 1000); last = t; clock += dt;
  if (!brain) return;
  // Once the show finishes and nobody is interacting, stop computing.
  if (cycleDone && clock - lastPoke > 8) sleeping = true;
  if (sleeping) return;
  if (trained && !cycleDone && clock > cycleAt) {
    shapeIndex = (shapeIndex + 1) % shapes.length; assign(shapes[shapeIndex]);
    cycleAt = clock + shapes[shapeIndex].hold + 3;
    if (shapeIndex === 0) { cycleDone = true; lastPoke = clock + 8; }
  }
  stepClock += dt * 36;
  const steps = Math.min(4, stepClock | 0); stepClock -= steps;
  const hue = shapes[shapeIndex].hue, lim = halfX + 3, sz = small ? 2.2 : 3;
  for (let i = 0; i < N; i++) {
    const d = drones[i];
    for (let k = 0; k < steps; k++) {
      D.step(brain, d, d.tx, d.ty);
      // The pointer acts as a real gust. The controller has to recover.
      const ax = d.x - px, ay = d.y - py, q = ax * ax + ay * ay;
      if (q < 1.2) { d.vx += ax / (q + .1) * .35; d.vy += ay / (q + .1) * .35; }
    }
    if (d.y < -VIEW_H / 2 || d.y > VIEW_H + 1 || d.x < -lim || d.x > lim || !(d.x === d.x)) spawn(d, i);
    d.r += (hue[0] - d.r) * .03; d.g += (hue[1] - d.g) * .03; d.b += (hue[2] - d.b) * .03;
  }
  // Fading the last frame leaves short flight trails.
  x.fillStyle = "rgba(3,5,15,.3)"; x.fillRect(0, 0, W, H);
  for (let i = 0; i < N; i++) {
    const d = drones[i], speed = Math.min(1, Math.hypot(d.vx, d.vy) / 5);
    const r = d.r * 255 + (255 - d.r * 255) * speed * .4 | 0, g = d.g * 255 * (1 - speed * .55) | 0, b = d.b * 255 * (1 - speed * .3) | 0;
    x.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
    x.fillRect(W / 2 + d.x * pxm - sz / 2, H / 2 - d.y * pxm - sz / 2, sz, sz);
  }
}
let rt, bw = innerWidth;
addEventListener("resize", () => { if (innerWidth === bw) return; bw = innerWidth; clearTimeout(rt); rt = setTimeout(layout, 150); });
S.ready(() => { bw = innerWidth; layout(); requestAnimationFrame(frame); });
}
</script>
</body>
</html>
