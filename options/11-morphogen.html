<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02070c">
<style>
html,body{height:100%;margin:0;background:#02070c;color:#e8fff8;overflow:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.ui{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:0 clamp(16px,3vw,40px) max(22px,env(safe-area-inset-bottom));pointer-events:none}
.tag{font-size:13px;letter-spacing:.04em;color:#8fd8cb;line-height:1.5}
.tag b{display:block;color:#fff;font-size:15px;font-weight:500}
.links{display:flex;gap:10px;pointer-events:auto}
a{color:#e8fff8;text-decoration:none;font-size:14px;padding:11px 22px;border-radius:99px;border:1px solid #6fffe066;background:#04201f;transition:background .2s,color .2s}
a:hover,a:focus-visible{background:#6fffe0;color:#02070c}
</style>
</head>
<body>
<h1 id="sr"></h1>
<canvas id="c" role="img" aria-label="An organic pattern growing in the shape of this person's name"></canvas>
<div class="ui">
  <div class="tag"><b id="role"></b>Grown from a reaction-diffusion equation. Draw on it.</div>
  <div class="links"><a id="gh" rel="me noopener">GitHub</a><a id="li" rel="me noopener">LinkedIn</a></div>
</div>
<script src="../config.js"></script>
<script>
const S = SITE, $ = id => document.getElementById(id);
$("sr").textContent = S.full; $("role").textContent = S.role; $("gh").href = S.github; $("li").href = S.linkedin;
const c = $("c"), x = c.getContext("2d");
let G, Hh, U, V, U2, V2, life, img;

// Colour ramp: deep sea to bioluminescent teal to hot pink tips.
const STOPS = [[2, 7, 12], [6, 60, 74], [24, 196, 170], [190, 255, 225], [255, 110, 190]];
const LUT = new Uint8Array(768);
for (let i = 0; i < 256; i++) {
  const t = i / 255 * (STOPS.length - 1), a = Math.min(t | 0, STOPS.length - 2), f = t - a;
  for (let k = 0; k < 3; k++) LUT[i * 3 + k] = STOPS[a][k] + (STOPS[a + 1][k] - STOPS[a][k]) * f;
}

function setup() {
  const asp = innerWidth / innerHeight, narrow = asp < .9;
  G = Math.round((narrow ? 250 : asp < 1.4 ? 360 : 460) * [.55, .78, 1][S.tier()]);
  Hh = Math.round(G / asp);
  c.width = G; c.height = Hh;
  img = x.createImageData(G, Hh);
  const n = G * Hh;
  U = new Float32Array(n).fill(1); V = new Float32Array(n); U2 = new Float32Array(n); V2 = new Float32Array(n);
  life = new Float32Array(n);
  const m = document.createElement("canvas"); m.width = G; m.height = Hh;
  const g = m.getContext("2d", { willReadFrequently: true }), face = '900 100px "Arial Black","Helvetica Neue",Arial,sans-serif';
  const lines = narrow ? S.lines(true) : [S.first.toUpperCase(), S.last.toUpperCase()];
  g.font = face;
  const widest = Math.max(...lines.map(l => g.measureText(l).width));
  const size = Math.min(100 * G * .93 / widest, Hh * .74 / lines.length);
  g.font = face.replace("100px", size + "px");
  g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = "#fff";
  lines.forEach((l, i) => g.fillText(l, G / 2, Hh * .45 + (i - (lines.length - 1) / 2) * size * 1.04));
  const d = g.getImageData(0, 0, G, Hh).data;
  for (let i = 0; i < n; i++) {
    life[i] = d[i * 4 + 3] / 255;
    if (life[i] > .5 && Math.random() < .06) { V[i] = 1; U[i] = .4; }
  }
}

// Gray-Scott model. Inside the letters the parameters sustain coral growth; outside it dies off.
function step() {
  const w = G, h = Hh;
  for (let y = 1; y < h - 1; y++) {
    const r = y * w;
    for (let i = r + 1; i < r + w - 1; i++) {
      const u = U[i], v = V[i];
      const lu = .2 * (U[i - 1] + U[i + 1] + U[i - w] + U[i + w]) + .05 * (U[i - w - 1] + U[i - w + 1] + U[i + w - 1] + U[i + w + 1]) - u;
      const lv = .2 * (V[i - 1] + V[i + 1] + V[i - w] + V[i + w]) + .05 * (V[i - w - 1] + V[i - w + 1] + V[i + w - 1] + V[i + w + 1]) - v;
      const l = life[i], F = .03 + .0245 * l, k = .074 - .012 * l, uvv = u * v * v;
      U2[i] = u + (lu - uvv + F * (1 - u));
      V2[i] = v + (.5 * lv + uvv - (F + k) * v);
    }
  }
  let t = U; U = U2; U2 = t; t = V; V = V2; V2 = t;
}
function draw() {
  const p = img.data;
  for (let i = 0; i < G * Hh; i++) {
    const v = Math.min(255, V[i] * 520 + life[i] * 62) | 0, o = i * 4;
    p[o] = LUT[v * 3]; p[o + 1] = LUT[v * 3 + 1]; p[o + 2] = LUT[v * 3 + 2]; p[o + 3] = 255;
  }
  x.putImageData(img, 0, 0);
}

// Drawing makes new ground the pattern can colonise.
function paint(e) {
  awakeUntil = Math.max(awakeUntil, performance.now() + 12000);
  const cx = e.clientX / innerWidth * G | 0, cy = e.clientY / innerHeight * Hh | 0, R = 5;
  for (let b = -R; b <= R; b++) for (let a = -R; a <= R; a++) {
    if (a * a + b * b > R * R) continue;
    const q = cx + a, r = cy + b;
    if (q < 1 || r < 1 || q >= G - 1 || r >= Hh - 1) continue;
    const i = r * G + q;
    life[i] = 1;
    if (Math.random() < .25) { V[i] = 1; U[i] = .4; }
  }
}
let down = false;
c.addEventListener("pointerdown", e => { down = true; paint(e); c.setPointerCapture(e.pointerId); });
c.addEventListener("pointermove", e => { if (down) paint(e); });
c.addEventListener("pointerup", () => down = false);

const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
// Simulation steps per frame adapt to the device, so slow phones stay smooth.
let iters = 6;
// The pattern settles after about a minute, so stop computing. Drawing wakes it up again.
let awakeUntil = 0;
function frame() {
  if (!still) requestAnimationFrame(frame);
  if (document.hidden || performance.now() > awakeUntil) return;
  const t0 = performance.now();
  for (let k = 0; k < iters; k++) step();
  draw();
  const ms = performance.now() - t0;
  if (ms > 12 && iters > 1) iters--;
  else if (ms < 7 && iters < 10) iters++;
}
S.ready(() => {
  setup();
  awakeUntil = performance.now() + 60000;
  if (still) { for (let k = 0; k < 2500; k++) step(); draw(); } else requestAnimationFrame(frame);
});
let rt, bw = innerWidth;
addEventListener("resize", () => { if (innerWidth === bw) return; bw = innerWidth; clearTimeout(rt); rt = setTimeout(setup, 180); });
</script>
</body>
</html>
