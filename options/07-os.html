<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b0b3a">
<style>
:root{--g:#c3c3c3;--hi:#fff;--lo:#555;--title:linear-gradient(90deg,#ff2fa0,#7a2bff 55%,#00d0ff)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#12072b;font:13px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.wall{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#12072b,#3a0f6b 50%,#c02a8c 62%,#12072b 62%)}
.sun{position:absolute;left:50%;top:62%;width:min(48vw,420px);aspect-ratio:1;transform:translate(-50%,-68%);border-radius:50%;background:linear-gradient(#ffe25a,#ff7a3c 50%,#ff2fa0);-webkit-mask:repeating-linear-gradient(#000 0 13%,#0000 13% 16%);mask:repeating-linear-gradient(#000 0 13%,#0000 13% 16%);box-shadow:0 0 90px #ff2fa0}
.floor{position:absolute;left:-50%;right:-50%;top:62%;bottom:-40%;transform:perspective(320px) rotateX(62deg);transform-origin:top;background-image:linear-gradient(#00e5ff 2px,#0000 2px),linear-gradient(90deg,#00e5ff 2px,#0000 2px);background-size:64px 64px;animation:move 1.6s linear infinite;opacity:.65}
@keyframes move{to{background-position:0 64px}}
.brand{position:absolute;left:50%;top:9%;transform:translateX(-50%);width:100%;padding:0 16px;text-align:center;color:#fff;font:900 clamp(30px,7vw,92px)/1 "Arial Black",Arial,sans-serif;letter-spacing:-.03em;text-shadow:3px 3px 0 #ff2fa0,-3px -2px 0 #00e5ff;pointer-events:none}
#desk{position:fixed;inset:0 0 40px 0;z-index:2}
.icons{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:12px;z-index:1}
.icon{all:unset;width:76px;text-align:center;color:#fff;font-size:12px;cursor:pointer;text-shadow:0 1px 2px #000}
.icon i{display:block;font-style:normal;font-size:30px;line-height:1.2}
.icon:hover span,.icon:focus-visible span{background:#7a2bff}
.win{position:absolute;background:var(--g);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:3px 4px 0 #0007;display:flex;flex-direction:column;min-width:0;will-change:transform}
.win.hidden{display:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 3px 3px 7px;background:var(--title);color:#fff;font-weight:700;cursor:move;touch-action:none;user-select:none;-webkit-user-select:none}
.bar button{all:unset;width:18px;height:16px;line-height:14px;background:var(--g);color:#000;text-align:center;border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);cursor:pointer;font-size:11px}
.body{margin:3px;background:#fff;color:#111;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);flex:1;min-height:0;overflow:auto;padding:10px}
.dark{background:#05010f;color:#66ffa8;padding:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
canvas{display:block;width:100%;height:100%}
.body h2{margin:0;font:900 20px/1.1 "Arial Black",Arial,sans-serif}
.body p{margin:6px 0 0}
.folder{display:flex;gap:18px;flex-wrap:wrap}
.folder a{color:#00129a;text-align:center;font-weight:700;text-decoration:none}
.folder a i{display:block;font-size:40px;font-style:normal}
.folder a:hover,.folder a:focus-visible{background:#d9e6ff}
.row{display:grid;grid-template-columns:62px 1fr 34px;gap:6px;align-items:center;margin:0 0 6px}
.meter{height:12px;background:#17102a;overflow:hidden}
.meter b{display:block;height:100%;background:linear-gradient(90deg,#00e5ff,#ff2fa0);transition:width .4s}
.task{position:fixed;left:0;right:0;bottom:0;height:40px;z-index:50;background:var(--g);border-top:2px solid var(--hi);display:flex;align-items:center;gap:5px;padding:4px 5px calc(4px + env(safe-area-inset-bottom));overflow:hidden}
.task button,.task time{font:inherit;height:30px;background:var(--g);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);padding:0 9px;white-space:nowrap}
.task button{cursor:pointer}
.task button.on{border-color:var(--lo) var(--hi) var(--hi) var(--lo);background:#ddd}
.start{font-weight:900!important}
.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow:hidden}
.task time{margin-left:auto;display:flex;align-items:center;border-color:var(--lo) var(--hi) var(--hi) var(--lo);flex:none}
#boot{position:fixed;inset:0;z-index:99;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font:900 28px "Arial Black",Arial;transition:opacity .4s}
#boot span{background:var(--title);-webkit-background-clip:text;background-clip:text;color:transparent}
@media (max-width:900px){
 #desk{overflow-y:auto;padding:58% 10px 18px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
 .icons{display:none}
 .win{position:relative;left:auto!important;top:auto!important;width:100%!important;height:auto!important;transform:none!important;flex:none}
 .win .body.tall{height:210px}
 .bar{cursor:default;touch-action:auto}
 .wall .brand{top:7%;font-size:clamp(30px,10vw,60px)}
 .sun{width:58vw;top:34%}.floor{top:34%}
 .wall{background:linear-gradient(#12072b,#3a0f6b 26%,#c02a8c 34%,#12072b 34%)}
 .tabs{display:none}
}
@media (prefers-reduced-motion:reduce){.floor{animation:none}}
</style>
</head>
<body>
<div class="wall" aria-hidden="true"><div class="sun"></div><div class="floor"></div><div class="brand" id="brand"></div></div>
<div id="desk"><div class="icons" id="icons"></div></div>
<div class="task">
  <button class="start" id="start">★ AK-OS</button>
  <div class="tabs" id="tabs"></div>
  <time id="clock"></time>
</div>
<div id="boot"><span>AK-OS 98</span></div>
<script src="../config.js"></script>
<script>
const S = SITE, $ = id => document.getElementById(id), desk = $("desk");
const mobile = () => innerWidth <= 900;
$("brand").textContent = S.full.toUpperCase();
const APPS = {
  about: { icon: "📄", title: "about.txt", x: .2, y: .24, w: 330, h: 188, html: "<h2>" + S.full + "</h2><p>" + S.roles.join(" · ") + "</p><p>Welcome to my operating system. Drag the windows around, play some Snake. Nothing here can hurt you.</p>" },
  links: { icon: "📁", title: "My Links", x: .2, y: .6, w: 330, h: 158, html: '<div class="folder"><a id="gh" rel="me noopener" href="' + S.github + '"><i>🐙</i>GitHub.lnk</a><a id="li" rel="me noopener" href="' + S.linkedin + '"><i>💼</i>LinkedIn.lnk</a></div>' },
  train: { icon: "📈", title: "train.py (running)", x: .47, y: .24, w: 400, h: 246, dark: 1, tall: 1, html: '<canvas id="loss"></canvas>' },
  gpu: { icon: "🔥", title: "Task Manager", x: .47, y: .58, w: 300, h: 212, html: '<div id="meters"></div>' },
  snake: { icon: "🐍", title: "snake.exe", x: .78, y: .28, w: 270, h: 320, dark: 1, tall: 1, html: '<canvas id="snake" tabindex="0" aria-label="Snake game" style="touch-action:none"></canvas>' },
};
let z = 10;
function focus(w) { w.style.zIndex = ++z; renderTabs(); }
for (const [id, a] of Object.entries(APPS)) {
  const w = document.createElement("section");
  w.className = "win"; w.id = "w-" + id; w.dataset.title = a.title;
  w.innerHTML = '<div class="bar"><span>' + a.title + '</span><button aria-label="Close">×</button></div><div class="body' + (a.dark ? " dark" : "") + (a.tall ? " tall" : "") + '">' + a.html + "</div>";
  w.style.width = a.w + "px"; w.style.height = a.h + "px";
  desk.append(w);
  a.el = w;
  w.addEventListener("pointerdown", () => focus(w));
  w.querySelector("button").onclick = e => { e.stopPropagation(); w.classList.add("hidden"); renderTabs(); };
  const bar = w.querySelector(".bar");
  let sx, sy, on = false;
  bar.addEventListener("pointerdown", e => {
    if (mobile() || e.target.tagName === "BUTTON") return;
    on = true; sx = e.clientX - w.offsetLeft; sy = e.clientY - w.offsetTop; bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener("pointermove", e => {
    if (!on) return;
    w.style.left = Math.max(-w.offsetWidth + 80, Math.min(innerWidth - 80, e.clientX - sx)) + "px";
    w.style.top = Math.max(0, Math.min(innerHeight - 70, e.clientY - sy)) + "px";
  });
  bar.addEventListener("pointerup", () => on = false);
  const ic = document.createElement("button");
  ic.className = "icon"; ic.innerHTML = "<i>" + a.icon + "</i><span>" + a.title.replace(" (running)", "") + "</span>";
  ic.onclick = () => { w.classList.remove("hidden"); focus(w); };
  $("icons").append(ic);
}
function layout() {
  const W = innerWidth, H = innerHeight - 40;
  for (const a of Object.values(APPS)) {
    a.el.style.left = Math.min(W - a.w - 8, Math.max(96, W * a.x)) + "px";
    a.el.style.top = Math.min(H - a.h - 8, H * a.y) + "px";
  }
  APPS.snake.el.style.left = Math.max(96, W - 278) + "px";
}
layout();
function renderTabs() {
  const tabs = $("tabs"); tabs.textContent = "";
  let topWin = null;
  for (const a of Object.values(APPS)) if (!a.el.classList.contains("hidden") && (!topWin || +a.el.style.zIndex > +topWin.style.zIndex)) topWin = a.el;
  for (const a of Object.values(APPS)) {
    if (a.el.classList.contains("hidden")) continue;
    const b = document.createElement("button");
    b.textContent = a.title.replace(" (running)", ""); b.className = a.el === topWin ? "on" : "";
    b.onclick = () => focus(a.el);
    tabs.append(b);
  }
}
renderTabs();
$("start").onclick = () => { for (const a of Object.values(APPS)) a.el.classList.remove("hidden"); layout(); renderTabs(); };
setTimeout(() => { $("boot").style.opacity = 0; setTimeout(() => $("boot").remove(), 400); }, 650);

function clock() { $("clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
clock(); setInterval(clock, 15000);

// Task manager
const METERS = ["GPU", "VRAM", "CPU", "Caffeine", "Ideas", "Vibes"];
$("meters").innerHTML = METERS.map((m, i) => '<div class="row"><span>' + m + '</span><div class="meter"><b id="m' + i + '"></b></div><span id="v' + i + '"></span></div>').join("");
function meters() {
  if (document.hidden) return;
  const v = [92 + Math.random() * 8, 70 + Math.random() * 28, 30 + Math.random() * 40, 96 + Math.random() * 4, 100, 88 + Math.random() * 12];
  v.forEach((n, i) => { $("m" + i).style.width = n + "%"; $("v" + i).textContent = Math.round(n) + "%"; });
}
meters(); setInterval(meters, 900);

// Fake training chart: decorative, labelled as a joke.
const lossC = $("loss"), losses = []; let val = 2.6, ep = 0;
function drawLoss() {
  if (document.hidden) return;
  const r = lossC.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
  if (!r.width) return;
  if (lossC.width !== (r.width * d | 0) || lossC.height !== (r.height * d | 0)) { lossC.width = r.width * d; lossC.height = r.height * d; }
  const x = lossC.getContext("2d"); x.setTransform(d, 0, 0, d, 0, 0);
  const w = r.width, h = r.height;
  ep++;
  val = Math.max(.02, val * .992 + (Math.random() - .5) * .05 * val);
  if (ep % 500 === 0) val = 2.6;
  losses.push(val); if (losses.length > 300) losses.shift();
  x.fillStyle = "#05010f"; x.fillRect(0, 0, w, h);
  x.strokeStyle = "#1a5c3c"; x.lineWidth = 1; x.beginPath();
  for (let i = 1; i < 5; i++) { x.moveTo(0, h * i / 5); x.lineTo(w, h * i / 5); }
  x.stroke();
  x.strokeStyle = "#66ffa8"; x.lineWidth = 1.5; x.beginPath();
  losses.forEach((l, i) => { const px = i / 299 * w, py = h - l / 2.8 * (h - 30) - 8; i ? x.lineTo(px, py) : x.moveTo(px, py); });
  x.stroke();
  x.fillStyle = "#66ffa8"; x.font = "12px ui-monospace,Menlo,monospace";
  x.fillText("step " + ep + "   loss " + val.toFixed(4), 8, 16);
  x.fillStyle = "#ff5cb0"; x.fillText("vibes: improving", 8, 32);
}
setInterval(drawLoss, 66);

// Snake
const sn = $("snake"), N = 16;
let snake, dir, nextDir, food, score, best = 0, dead;
function reset() { snake = [[8, 8], [7, 8], [6, 8]]; dir = [1, 0]; nextDir = dir; score = 0; dead = false; place(); }
function place() { do food = [Math.random() * N | 0, Math.random() * N | 0]; while (snake.some(s => s[0] === food[0] && s[1] === food[1])); }
function turn(a, b) { if (a !== -dir[0] || b !== -dir[1]) nextDir = [a, b]; }
function stepSnake() {
  if (document.hidden) return;
  if (!dead) {
    dir = nextDir;
    const h = [(snake[0][0] + dir[0] + N) % N, (snake[0][1] + dir[1] + N) % N];
    if (snake.some(s => s[0] === h[0] && s[1] === h[1])) { dead = true; best = Math.max(best, score); }
    else {
      snake.unshift(h);
      if (h[0] === food[0] && h[1] === food[1]) { score++; place(); } else snake.pop();
    }
  }
  const r = sn.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
  if (!r.width) return;
  if (sn.width !== (r.width * d | 0) || sn.height !== (r.height * d | 0)) { sn.width = r.width * d; sn.height = r.height * d; }
  const x = sn.getContext("2d"); x.setTransform(d, 0, 0, d, 0, 0);
  const top = 20, c = Math.min(r.width, r.height - top) / N, ox = (r.width - c * N) / 2;
  x.fillStyle = "#05010f"; x.fillRect(0, 0, r.width, r.height);
  x.fillStyle = "#66ffa8"; x.font = "12px ui-monospace,Menlo,monospace";
  x.fillText("score " + score + "  best " + best, 2, 13);
  x.strokeStyle = "#1a5c3c"; x.strokeRect(ox + .5, top + .5, c * N - 1, c * N - 1);
  x.fillStyle = "#ff2fa0"; x.fillRect(ox + food[0] * c + 1, top + food[1] * c + 1, c - 2, c - 2);
  x.fillStyle = "#66ffa8";
  for (const s of snake) x.fillRect(ox + s[0] * c + 1, top + s[1] * c + 1, c - 2, c - 2);
  if (dead) { x.fillStyle = "#fff"; x.textAlign = "center"; x.fillText("GAME OVER: click to retry", r.width / 2, top + c * N / 2); x.textAlign = "left"; }
}
reset(); setInterval(stepSnake, 130);
addEventListener("keydown", e => {
  const m = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] }[e.key];
  if (m) { turn(m[0], m[1]); e.preventDefault(); e.stopPropagation(); }
});
let px, py;
sn.addEventListener("pointerdown", e => { px = e.clientX; py = e.clientY; if (dead) reset(); });
sn.addEventListener("pointerup", e => {
  const dx = e.clientX - px, dy = e.clientY - py;
  if (Math.hypot(dx, dy) < 12) return;
  Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
});
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(layout, 150); });
</script>
</body>
</html>
