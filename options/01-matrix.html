<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<style>
html,body{height:100%;margin:0;background:#000;color:#b8ffc8;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#glow{filter:blur(16px);opacity:0;transition:opacity 1.2s;mix-blend-mode:screen}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.ui{position:fixed;left:0;right:0;bottom:max(6vh,calc(env(safe-area-inset-bottom) + 24px));display:flex;flex-direction:column;align-items:center;gap:18px;padding:0 16px;text-align:center;z-index:3}
.role{min-height:1.4em;margin:0;font-size:clamp(13px,1.6vw,18px);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 0 12px #00ff55,0 0 2px #000,0 0 6px #000}
.role i{font-style:normal;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.pills{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.pill{position:relative;display:block;width:172px;padding:14px 0;border-radius:99px;color:#fff;font-weight:700;font-size:15px;letter-spacing:.06em;text-decoration:none;transition:transform .18s}
.pill::after{content:"";position:absolute;left:12%;right:12%;top:5px;height:30%;border-radius:99px;background:linear-gradient(#ffffffb0,#ffffff10)}
.pill:hover,.pill:focus-visible{transform:scale(1.08) rotate(-2deg)}
.red{background:radial-gradient(120% 130% at 30% 20%,#ff6b6b,#c30010 55%,#500006);box-shadow:0 0 32px #ff002a99}
.blue{background:radial-gradient(120% 130% at 30% 20%,#6cb6ff,#0055d4 55%,#001f5c);box-shadow:0 0 32px #006cff99}
.soon{margin:0;font-size:12px;letter-spacing:.32em;color:#6dff94;text-shadow:0 0 4px #000,0 0 8px #000}
</style>
</head>
<body>
<h1 class="sr" id="sr"></h1>
<canvas id="rain"></canvas>
<canvas id="glow"></canvas>
<canvas id="name"></canvas>
<div class="ui">
  <p class="role"><span id="role"></span><i>_</i></p>
  <div class="pills">
    <a class="pill red" id="gh" rel="me noopener">GitHub</a>
    <a class="pill blue" id="li" rel="me noopener">LinkedIn</a>
  </div>
  <p class="soon">CHOOSE WISELY</p>
</div>
<script src="../config.js"></script>
<script>
const S = SITE, $ = id => document.getElementById(id);
$("sr").textContent = S.full; $("gh").href = S.github; $("li").href = S.linkedin;
const rain = $("rain"), nameC = $("name"), glow = $("glow");
const rc = rain.getContext("2d", { alpha: false }), nc = nameC.getContext("2d");
const GLYPHS = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789Z:.=*+<>|";
const glyph = () => GLYPHS[Math.random() * GLYPHS.length | 0];
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
let W, H, cols, rows, cell, drops, mask, locked, targets, lockedList, lockedCount, started;

function setup() {
  W = innerWidth; H = innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cell = (W < 1000 ? 8 : Math.min(11, W / 150)) + [3, 1, 0][S.tier()];
  cols = Math.ceil(W / cell); rows = Math.ceil(H / cell);
  // Stack the name unless each letter gets at least 10 glyphs of width.
  const narrow = cols < 150 || W / H < 1.3;
  for (const c of [rain, nameC]) { c.width = W * dpr; c.height = H * dpr; }
  for (const x of [rc, nc]) {
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.font = "bold " + cell + "px ui-monospace,Menlo,Consolas,monospace";
    x.textBaseline = "top";
  }
  rc.fillStyle = "#000"; rc.fillRect(0, 0, W, H);

  // Rasterise the name to one pixel per glyph cell.
  const m = document.createElement("canvas"); m.width = cols; m.height = rows;
  const mx = m.getContext("2d", { willReadFrequently: true });
  const lines = S.lines(narrow), face = '900 100px "Arial Black","Helvetica Neue",Arial,sans-serif';
  mx.font = face;
  const widest = Math.max(...lines.map(l => mx.measureText(l).width));
  const size = Math.min(100 * cols * .93 / widest, rows * (narrow ? .56 : .42) / lines.length);
  mx.font = face.replace("100px", size + "px");
  mx.textAlign = "center"; mx.textBaseline = "middle"; mx.fillStyle = "#fff";
  const lh = size * 1.02, y0 = rows * (narrow ? .37 : .4) - lh * (lines.length - 1) / 2;
  lines.forEach((l, i) => mx.fillText(l, cols / 2, y0 + i * lh));
  const px = mx.getImageData(0, 0, cols, rows).data;
  mask = new Uint8Array(cols * rows);
  targets = 0;
  for (let i = 0; i < mask.length; i++) if (px[i * 4 + 3] > 110) { mask[i] = 1; targets++; }

  // Static blurred copy of the name acts as cheap glow.
  glow.width = cols; glow.height = rows;
  const gx = glow.getContext("2d");
  gx.fillStyle = "#00ff66";
  for (let i = 0; i < mask.length; i++) if (mask[i]) gx.fillRect(i % cols, i / cols | 0, 1, 1);
  glow.style.opacity = 0;

  locked = new Uint8Array(cols * rows); lockedList = []; lockedCount = 0;
  nc.clearRect(0, 0, W, H);
  drops = Array.from({ length: cols }, () => ({ y: -Math.random() * rows * .7, v: .45 + Math.random() * .55, row: -1 }));
  started = performance.now();
  if (still) for (let i = 0; i < mask.length; i++) if (mask[i]) lock(i);
}

function lock(i) {
  locked[i] = 1; lockedList.push(i); lockedCount++;
  drawLocked(i);
  if (lockedCount > targets * .8) glow.style.opacity = .55;
}

// A tinted block behind each glyph keeps the letters solid and readable.
function drawLocked(i) {
  const x = (i % cols) * cell, y = (i / cols | 0) * cell;
  nc.clearRect(x, y, cell, cell);
  nc.fillStyle = "rgba(0,235,90,.62)"; nc.fillRect(x, y, cell, cell);
  nc.fillStyle = "#f2fff5"; nc.fillText(glyph(), x, y);
}

function frame() {
  rc.fillStyle = "rgba(0,0,0,.075)"; rc.fillRect(0, 0, W, H);
  for (let x = 0; x < cols; x++) {
    const d = drops[x], before = d.y | 0;
    d.y += d.v;
    const r = d.y | 0;
    if (r !== before && r >= 0 && r < rows) {
      rc.fillStyle = "#16d94f";
      if (r > 0) rc.fillText(glyph(), x * cell, (r - 1) * cell);
      rc.fillStyle = "#eaffef";
      rc.fillText(glyph(), x * cell, r * cell);
      const i = r * cols + x;
      if (mask[i] && !locked[i]) lock(i);
    }
    if (d.y > rows && Math.random() < .03) { d.y = -Math.random() * 20; d.v = .35 + Math.random() * .65; }
  }
  // Slow columns should not delay the name: fill any gaps after a few seconds.
  if (lockedCount < targets && performance.now() - started > 3500) {
    for (let k = 0, i = Math.random() * mask.length | 0; k < mask.length && lockedCount < targets; k++, i = (i + 1) % mask.length) {
      if (mask[i] && !locked[i]) { lock(i); if (Math.random() < .02) break; }
    }
  }
  // Flicker a few name glyphs so the letters stay alive.
  for (let k = 0; k < 14 && lockedList.length; k++) drawLocked(lockedList[Math.random() * lockedList.length | 0]);
}

let last = 0;
function loop(t) {
  requestAnimationFrame(loop);
  if (t - last < 33 || document.hidden) return;
  last = t; frame();
}

// Pointer pours new streams of code.
addEventListener("pointermove", e => {
  const x = e.clientX / cell | 0;
  for (let i = -1; i <= 1; i++) {
    const d = drops[x + i];
    if (d && Math.random() < .3) { d.y = e.clientY / cell | 0; d.v = 1; }
  }
}, { passive: true });

// Typewriter cycles through roles.
const role = $("role");
if (still) role.textContent = S.role;
else (async function type() {
  const wait = ms => new Promise(r => setTimeout(r, ms));
  await wait(1400);
  for (let i = 0; ; i = (i + 1) % S.roles.length) {
    const w = S.roles[i];
    for (let c = 1; c <= w.length; c++) { role.textContent = w.slice(0, c); await wait(38); }
    await wait(2200);
    for (let c = w.length; c >= 0; c--) { role.textContent = w.slice(0, c); await wait(14); }
  }
})();

let rt;
addEventListener("resize", () => {
  if (innerWidth === W) return;
  clearTimeout(rt); rt = setTimeout(setup, 150);
});
S.ready(() => { setup(); if (!still) requestAnimationFrame(loop); });
</script>
</body>
</html>
