<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050706">
<style>
:root{--gold:#e7b85a;--silk:#eef2e8;--dim:#8d9a8c;--led:#46ffd2;--hot:#ff4d5e}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#050706;color:var(--silk);overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
canvas#board,canvas#cars{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#infield{position:fixed;display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,1.4vh,14px);min-height:0}
#head{min-width:0}
h1{margin:0;font:900 clamp(22px,3.5vw,58px)/.98 "Arial Black","Helvetica Neue",Arial,sans-serif;letter-spacing:-.03em;text-transform:uppercase;color:var(--silk)}
.role{margin:6px 0 0;font-size:clamp(10px,1vw,13px);color:var(--gold);letter-spacing:.06em}
#lab{display:flex;gap:12px;min-height:0}
#net{flex:1 1 55%;min-width:0;height:clamp(90px,17vh,150px);display:block;border:1px solid #e7b85a40;background:#0a0e0ccc}
#stats{flex:1 1 45%;font-size:clamp(10px,.95vw,13px);line-height:1.55;min-width:0}
#stats div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #e7b85a30}
#stats b{font-weight:600;color:var(--led)}
#fit{display:block;width:100%;height:30px;margin-top:6px}
#links{display:flex;gap:14px;flex-wrap:wrap}
.ic{position:relative;display:block;padding:9px 16px;background:#14161a;color:var(--silk);text-decoration:none;font-weight:700;font-size:13px;border:1px solid #30343a}
.ic::before,.ic::after{content:"";position:absolute;left:8px;right:8px;height:5px;background:repeating-linear-gradient(90deg,var(--gold) 0 5px,#0000 5px 11px)}
.ic::before{top:-6px}.ic::after{bottom:-6px}
.ic small{color:var(--dim);font-weight:400;margin-right:6px}
.ic:hover,.ic:focus-visible{background:var(--gold);color:#050706}.ic:hover small,.ic:focus-visible small{color:#050706}
body.narrow #head{position:fixed;left:16px;right:16px;top:max(12px,env(safe-area-inset-top))}
body.narrow h1{font-size:9.6vw}
body.narrow #links{position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));justify-content:center}
body.narrow #lab{flex-direction:column;flex:1;gap:8px}
body.narrow #net{flex:none;height:30%}
body.narrow #stats{flex:none;font-size:10px}
body.narrow #infield{justify-content:center}
#hint{font-size:10px;color:var(--dim);margin:0}
</style>
</head>
<body>
<canvas id="board" aria-hidden="true"></canvas>
<canvas id="cars" aria-hidden="true"></canvas>
<div id="infield">
  <div id="head"><h1 id="name"></h1><p class="role" id="role"></p></div>
  <div id="lab">
    <canvas id="net" aria-label="The current leader's neural network"></canvas>
    <div id="stats">
      <div><span>GENERATION</span><b id="gen">0</b></div>
      <div><span>ALIVE</span><b id="alive">0</b></div>
      <div><span>CIRCUITS FLOWN</span><b id="best">0</b></div>
      <div><span>BEST CIRCUIT</span><b id="lap">--</b></div>
      <canvas id="fit"></canvas>
    </div>
  </div>
  <p id="hint">Real neural nets learn to fly this circuit, live on your device.</p>
  <div id="links">
    <a class="ic" id="gh" rel="me noopener"><small>U1</small>GitHub</a>
    <a class="ic" id="li" rel="me noopener"><small>U2</small>LinkedIn</a>
  </div>
</div>
<script src="../config.js"></script>
<script>
{
const S = SITE, $ = id => document.getElementById(id);
$("name").innerHTML = S.first + "<br>" + S.last; $("role").textContent = "ML · Software · Electrical · Pilot";
$("gh").href = S.github; $("li").href = S.linkedin;
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---- Track: an octilinear PCB trace, smoothed so it can be driven ----
const BW = 1000, BH = 600, TRACK_W = 58;
let route = [[200,90],[560,90],[620,150],[700,150],[760,90],[910,90],[910,250],[840,320],[910,390],[910,510],[640,510],[580,450],[480,450],[420,510],[90,510],[90,380],[160,310],[90,240],[90,90]];
for (let it = 0; it < 3; it++) {
  const out = [];
  for (let i = 0; i < route.length; i++) {
    const a = route[i], b = route[(i + 1) % route.length];
    out.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25], [a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75]);
  }
  route = out;
}
// Resample evenly along the centre line.
const center = [];
for (let i = 0, carry = 0; i < route.length; i++) {
  const a = route[i], b = route[(i + 1) % route.length], len = Math.hypot(b[0] - a[0], b[1] - a[1]);
  let d = carry;
  while (d < len) { center.push([a[0] + (b[0] - a[0]) * d / len, a[1] + (b[1] - a[1]) * d / len]); d += 4; }
  carry = d - len;
}
const NC = center.length;
const trackPath = ctx => { ctx.beginPath(); route.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); };

const MS = .5, MW = BW * MS | 0, MH = BH * MS | 0, mask = new Uint8Array(MW * MH);
{
  const m = document.createElement("canvas"); m.width = MW; m.height = MH;
  const g = m.getContext("2d", { willReadFrequently: true });
  g.scale(MS, MS); g.lineJoin = "round"; g.lineWidth = TRACK_W; g.strokeStyle = "#fff"; trackPath(g); g.stroke();
  const d = g.getImageData(0, 0, MW, MH).data;
  for (let i = 0; i < mask.length; i++) mask[i] = d[i * 4 + 3] > 128 ? 1 : 0;
}
const onTrack = (x, y) => { const a = x * MS | 0, b = y * MS | 0; return a >= 0 && b >= 0 && a < MW && b < MH && mask[b * MW + a] === 1; };

// ---- Neural net: 7 distance sensors plus speed, 6 hidden, steering and throttle ----
const RAYS = [-1.31, -.79, -.35, 0, .35, .79, 1.31], NI = RAYS.length + 1, NH = 6, NO = 2;
const GENES = (NI + 1) * NH + (NH + 1) * NO;
const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(6.2832 * Math.random());
const inp = new Float32Array(NI), hid = new Float32Array(NH), oup = new Float32Array(NO);
function think(g) {
  let o = 0;
  for (let h = 0; h < NH; h++) {
    let s = g[o + NI];
    for (let i = 0; i < NI; i++) s += g[o + i] * inp[i];
    hid[h] = Math.tanh(s); o += NI + 1;
  }
  for (let k = 0; k < NO; k++) {
    let s = g[o + NH];
    for (let h = 0; h < NH; h++) s += g[o + h] * hid[h];
    oup[k] = Math.tanh(s); o += NH + 1;
  }
}

// ---- Simulation ----
const POP = [24, 40, Math.min(innerWidth, innerHeight) < 600 ? 44 : 72][S.tier()], MAX_RAY = 130;
let cars = [], generation = 0, bestLapEver = null, history = [], stepInGen = 0, leader = null, bestProgressEver = 0;
function spawn(genome) {
  return { g: genome, x: center[0][0], y: center[0][1] + (Math.random() - .5) * 12, a: (Math.random() - .5) * .12, v: 1.2, i: 0, prog: 0, stall: 0, dead: false, lapStart: 0, rays: new Float32Array(RAYS.length) };
}
function firstGeneration() {
  cars = Array.from({ length: POP }, () => { const g = new Float32Array(GENES); for (let i = 0; i < GENES; i++) g[i] = gauss() * .7; return spawn(g); });
}
function nextGeneration() {
  const sorted = [...cars].sort((a, b) => b.prog - a.prog);
  history.push(sorted[0].prog / NC); if (history.length > 60) history.shift();
  const next = [];
  for (let i = 0; i < 5; i++) next.push(spawn(sorted[i].g));
  const pool = sorted.slice(0, Math.max(10, POP >> 2));
  const pick = () => pool[Math.min(pool.length - 1, Math.random() * Math.random() * pool.length | 0)].g;
  while (next.length < POP) {
    const g = new Float32Array(GENES);
    if (Math.random() < .05) { for (let i = 0; i < GENES; i++) g[i] = gauss() * .7; }
    else {
      const a = pick(), b = Math.random() < .5 ? pick() : a;
      for (let i = 0; i < GENES; i++) {
        g[i] = Math.random() < .5 ? a[i] : b[i];
        if (Math.random() < .14) g[i] += gauss() * .32;
      }
    }
    next.push(spawn(g));
  }
  cars = next; generation++; stepInGen = 0; leader = cars[0];
}
function stepCar(c) {
  for (let r = 0; r < RAYS.length; r++) {
    const ang = c.a + RAYS[r], dx = Math.cos(ang), dy = Math.sin(ang);
    let d = 6;
    while (d < MAX_RAY && onTrack(c.x + dx * d, c.y + dy * d)) d += 5;
    c.rays[r] = d; inp[r] = d / MAX_RAY;
  }
  inp[RAYS.length] = c.v / 5;
  think(c.g);
  c.steer = oup[0]; c.throttle = oup[1] * .5 + .5;
  c.v += c.throttle * .15 - c.v * .03;
  c.a += c.steer * .085 * Math.min(1, c.v / 1.4);
  c.x += Math.cos(c.a) * c.v; c.y += Math.sin(c.a) * c.v;
  if (!onTrack(c.x, c.y)) { c.dead = true; return; }
  // Progress along the centre line, searched in a window around the last known position.
  let bestI = c.i, bestD = 1e9;
  for (let k = -4; k <= 14; k++) {
    const j = (c.i + k + NC) % NC, dx = center[j][0] - c.x, dy = center[j][1] - c.y, d = dx * dx + dy * dy;
    if (d < bestD) { bestD = d; bestI = k; }
  }
  if (bestI > 0) {
    const before = c.prog / NC | 0;
    c.prog += bestI; c.stall = 0;
    if ((c.prog / NC | 0) > before) {
      const secs = (stepInGen - c.lapStart) / 60;
      c.lapStart = stepInGen;
      if (bestLapEver === null || secs < bestLapEver) bestLapEver = secs;
    }
  } else { c.prog += Math.min(0, bestI); c.stall++; }
  c.i = (c.i + bestI + NC) % NC;
  if (c.stall > 110) c.dead = true;
}
function physics() {
  let alive = 0, best = null;
  for (const c of cars) {
    if (c.dead) continue;
    stepCar(c);
    if (!c.dead) { alive++; if (!best || c.prog > best.prog) best = c; }
  }
  stepInGen++;
  if (best) leader = best;
  if (best && best.prog > bestProgressEver) bestProgressEver = best.prog;
  // A fixed time limit means more progress requires more speed, so evolution rewards pace.
  if (!alive || stepInGen > 1300) nextGeneration();
}

// ---- Rendering ----
const board = $("board"), carsC = $("cars"), cx = carsC.getContext("2d");
let W, H, narrow, dpr, tf;
function layout() {
  W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2);
  narrow = W / H < 1.05;
  document.body.classList.toggle("narrow", narrow);
  for (const c of [board, carsC]) { c.width = W * dpr; c.height = H * dpr; }
  const inf = $("infield");
  if (narrow) {
    const topPad = 92, botPad = 74, s = Math.min((W - 12) / BH, (H - topPad - botPad) / BW);
    const ox = (W - BH * s) / 2, oy = topPad + (H - topPad - botPad - BW * s) / 2;
    tf = [0, s, -s, 0, ox + BH * s, oy]; // rotate the board a quarter turn
    Object.assign(inf.style, { left: ox + 150 * s + "px", top: oy + 200 * s + "px", width: 300 * s + "px", height: 600 * s + "px" });
  } else {
    const s = Math.min(W / (BW + 24), H / (BH + 24)), ox = (W - BW * s) / 2, oy = (H - BH * s) / 2;
    tf = [s, 0, 0, s, ox, oy];
    Object.assign(inf.style, { left: ox + 165 * s + "px", top: oy + 138 * s + "px", width: 660 * s + "px", height: 318 * s + "px" });
  }
  drawBoard();
}
const setBoardTf = c => c.setTransform(tf[0] * dpr, tf[1] * dpr, tf[2] * dpr, tf[3] * dpr, tf[4] * dpr, tf[5] * dpr);
function drawBoard() {
  const g = board.getContext("2d");
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = "#050706"; g.fillRect(0, 0, board.width, board.height);
  setBoardTf(g);
  // Solder mask.
  g.fillStyle = "#0c1110"; g.strokeStyle = "#e7b85a66"; g.lineWidth = 1.5;
  g.beginPath(); g.roundRect(4, 4, BW - 8, BH - 8, 16); g.fill(); g.stroke();
  // Seeded decoration: signal traces, vias and parts that stay off the track.
  let seed = 7; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const clear = (x, y, r) => { for (let a = 0; a < 6.28; a += .8) if (onTrack(x + Math.cos(a) * r, y + Math.sin(a) * r)) return false; return !onTrack(x, y); };
  g.lineCap = "round"; g.lineJoin = "round";
  for (let i = 0; i < 90; i++) {
    let x = 20 + rnd() * (BW - 40), y = 20 + rnd() * (BH - 40);
    if (!clear(x, y, 12)) continue;
    g.beginPath(); g.moveTo(x, y);
    g.strokeStyle = "#e7b85a2e"; g.lineWidth = 1.3;
    for (let k = 0; k < 4; k++) {
      const dir = (rnd() * 8 | 0) * Math.PI / 4, len = 18 + rnd() * 40, nx = x + Math.cos(dir) * len, ny = y + Math.sin(dir) * len;
      if (!clear(nx, ny, 8) || nx < 14 || ny < 14 || nx > BW - 14 || ny > BH - 14) break;
      g.lineTo(nx, ny); x = nx; y = ny;
    }
    g.stroke();
    g.beginPath(); g.arc(x, y, 2.6, 0, 6.3); g.fillStyle = "#e7b85a99"; g.fill();
    g.beginPath(); g.arc(x, y, 1, 0, 6.3); g.fillStyle = "#050706"; g.fill();
  }
  // Mounting holes.
  for (const [x, y] of [[26, 26], [BW - 26, 26], [26, BH - 26], [BW - 26, BH - 26]]) {
    g.beginPath(); g.arc(x, y, 11, 0, 6.3); g.fillStyle = "#e7b85a"; g.fill();
    g.beginPath(); g.arc(x, y, 6, 0, 6.3); g.fillStyle = "#000"; g.fill();
  }
  // Copper track.
  g.lineJoin = "round";
  trackPath(g); g.lineWidth = TRACK_W + 6; g.strokeStyle = "#e7b85a"; g.stroke();
  trackPath(g); g.lineWidth = TRACK_W; g.strokeStyle = "#191c1c"; g.stroke();
  trackPath(g); g.lineWidth = 1; g.setLineDash([10, 16]); g.strokeStyle = "#e7b85a55"; g.stroke(); g.setLineDash([]);
  // Runway threshold markings at the start.
  const s0 = center[0], bar = TRACK_W / 8;
  g.fillStyle = "#eef2e8";
  for (let r = 0; r < 8; r++) g.fillRect(s0[0] - 9, s0[1] - TRACK_W / 2 + r * bar + 1, 18, bar - 2);
  // Silkscreen labels in screen orientation.
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = "#eef2e8aa"; g.font = "10px ui-monospace,Menlo,monospace";
  const toScreen = (x, y) => [tf[0] * x + tf[2] * y + tf[4], tf[1] * x + tf[3] * y + tf[5]];
  // The edge labels would run off a rotated board, so narrow screens skip them.
  for (const [x, y, t] of narrow ? [] : [[62, 50, "REV A"], [930, 570, "ALEKAMI"], [500, 40, "T1 TRACK 58 MIL"], [500, 568, "HIGH CURRENT PATH"]]) {
    const p = toScreen(x, y); g.textAlign = "center"; g.fillText(t, p[0], p[1]);
  }
}

// Soft LED sprite, prerendered once.
const sprite = document.createElement("canvas"); sprite.width = sprite.height = 48;
{
  const g = sprite.getContext("2d"), r = g.createRadialGradient(24, 24, 1, 24, 24, 24);
  r.addColorStop(0, "#ffffffcc"); r.addColorStop(.25, "#46ffd255"); r.addColorStop(1, "#46ffd200");
  g.fillStyle = r; g.fillRect(0, 0, 48, 48);
}
function drawCars() {
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.clearRect(0, 0, carsC.width, carsC.height);
  setBoardTf(cx);
  if (leader && !leader.dead) {
    cx.strokeStyle = "#ffe14d66"; cx.lineWidth = 1; cx.fillStyle = "#ffe14d";
    for (let r = 0; r < RAYS.length; r++) {
      const ang = leader.a + RAYS[r], ex = leader.x + Math.cos(ang) * leader.rays[r], ey = leader.y + Math.sin(ang) * leader.rays[r];
      cx.beginPath(); cx.moveTo(leader.x, leader.y); cx.lineTo(ex, ey); cx.stroke();
      cx.fillRect(ex - 1.6, ey - 1.6, 3.2, 3.2);
    }
  }
  cx.globalCompositeOperation = "lighter";
  for (const c of cars) if (!c.dead) cx.drawImage(sprite, c.x - 12, c.y - 12, 24, 24);
  cx.globalCompositeOperation = "source-over";
  for (const c of cars) {
    if (c.dead) continue;
    const hot = c === leader, cs = Math.cos(c.a), sn = Math.sin(c.a);
    cx.save(); cx.transform(cs * 1.3, sn * 1.3, -sn * 1.3, cs * 1.3, c.x, c.y);
    cx.fillStyle = hot ? "#ff4d5e" : "#46ffd2";
    cx.fillRect(-8, -1.3, 16, 2.6);       // fuselage
    cx.fillRect(1, -8.5, 3.2, 17);        // wings
    cx.fillRect(-8, -3.6, 2, 7.2);        // tailplane
    cx.restore();
  }
}
function drawNet() {
  const c = $("net"), r = c.getBoundingClientRect();
  if (!r.width) return;
  const d = dpr;
  if (c.width !== (r.width * d | 0) || c.height !== (r.height * d | 0)) { c.width = r.width * d; c.height = r.height * d; }
  const g = c.getContext("2d"), w = r.width, h = r.height;
  g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, w, h);
  if (!leader) return;
  // Re-run the leader's brain so the picture shows its real activations.
  for (let i = 0; i < RAYS.length; i++) inp[i] = leader.rays[i] / MAX_RAY;
  inp[RAYS.length] = leader.v / 5;
  think(leader.g);
  const col = n => (i, cnt) => (i + 1) / (cnt + 1) * h;
  const X = [14, w * .5, w - 14], Y = [col()];
  const yI = i => (i + 1) / (NI + 1) * h, yH = i => (i + 1) / (NH + 1) * h, yO = i => (i + 1) / (NO + 1) * h;
  g.lineWidth = .8; let o = 0;
  for (let k = 0; k < NH; k++) {
    for (let i = 0; i < NI; i++) {
      const v = leader.g[o + i], a = Math.min(.65, Math.abs(v) * .28);
      g.strokeStyle = v > 0 ? "rgba(70,255,210," + a + ")" : "rgba(255,77,94," + a + ")";
      g.beginPath(); g.moveTo(X[0], yI(i)); g.lineTo(X[1], yH(k)); g.stroke();
    }
    o += NI + 1;
  }
  for (let k = 0; k < NO; k++) {
    for (let i = 0; i < NH; i++) {
      const v = leader.g[o + i], a = Math.min(.65, Math.abs(v) * .28);
      g.strokeStyle = v > 0 ? "rgba(70,255,210," + a + ")" : "rgba(255,77,94," + a + ")";
      g.beginPath(); g.moveTo(X[1], yH(i)); g.lineTo(X[2], yO(k)); g.stroke();
    }
    o += NH + 1;
  }
  const node = (x, y, v) => {
    const b = Math.max(0, Math.min(1, Math.abs(v)));
    g.fillStyle = "rgb(" + (40 + 190 * b | 0) + "," + (60 + 180 * b | 0) + "," + (40 + 60 * b | 0) + ")";
    g.beginPath(); g.arc(x, y, 3.8, 0, 6.3); g.fill();
  };
  for (let i = 0; i < NI; i++) node(X[0], yI(i), inp[i]);
  for (let i = 0; i < NH; i++) node(X[1], yH(i), hid[i]);
  for (let i = 0; i < NO; i++) node(X[2], yO(i), oup[i]);
}
function drawFit() {
  const c = $("fit"), r = c.getBoundingClientRect();
  if (!r.width || !history.length) return;
  if (c.width !== (r.width * dpr | 0)) { c.width = r.width * dpr; c.height = r.height * dpr; }
  const g = c.getContext("2d"), max = Math.max(...history, .1);
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, r.width, r.height);
  g.strokeStyle = "#46ffd2"; g.lineWidth = 1.4; g.beginPath();
  history.forEach((v, i) => { const x = history.length < 2 ? 0 : i / (history.length - 1) * r.width, y = r.height - v / max * (r.height - 3) - 1; i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.stroke();
}

let frameN = 0, last = 0, stepClock = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = t; return; }
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  // Early generations train faster. Once a pilot flies it quickly, watch in real time.
  const speed = bestLapEver !== null && bestLapEver < 14.5 ? 60 : 200;
  stepClock += dt * speed;
  const budget = performance.now() + 9;
  while (stepClock >= 1 && performance.now() < budget) { physics(); stepClock--; }
  if (stepClock > 8) stepClock = 0;
  drawCars();
  if (frameN++ % 3 === 0) {
    drawNet();
    $("gen").textContent = generation;
    $("alive").textContent = cars.filter(c => !c.dead).length + "/" + POP;
    $("best").textContent = (bestProgressEver / NC).toFixed(2);
    $("lap").textContent = bestLapEver === null ? "--" : bestLapEver.toFixed(1) + "s";
    if (frameN % 30 === 1) drawFit();
  }
}
let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(layout, 120); });
S.ready(() => {
  firstGeneration(); leader = cars[0]; layout();
  if (still) { for (let k = 0; k < 8000; k++) physics(); drawCars(); drawNet(); drawFit(); }
  else requestAnimationFrame(frame);
});
}
</script>
</body>
</html>
