<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<style>
html,body{height:100%;margin:0;background:#050505;color:#f4f4f0;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas:active{cursor:grabbing}
.ui{position:fixed;left:0;right:0;bottom:0;padding:0 clamp(16px,3vw,40px) max(22px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;pointer-events:none}
h1{margin:0;font-size:clamp(20px,3vw,40px);font-weight:700;letter-spacing:-.02em}
p{margin:4px 0 0;color:#8d8d86;font-size:clamp(12px,1.2vw,15px)}
.links{display:flex;gap:6px;pointer-events:auto;font-size:clamp(15px,1.5vw,19px)}
a{color:#ffe14d;text-decoration:none;padding:8px 6px}
a:hover,a:focus-visible{background:#ffe14d;color:#050505}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="ui">
  <div><h1 id="name"></h1><p id="role"></p></div>
  <div class="links"><a id="gh" rel="me noopener">[ github ]</a><a id="li" rel="me noopener">[ linkedin ]</a></div>
</div>
<script src="../config.js"></script>
<script>
const S = SITE, $ = id => document.getElementById(id);
$("name").textContent = S.full; $("role").textContent = S.role;
$("gh").href = S.github; $("li").href = S.linkedin;
const c = $("c"), x = c.getContext("2d", { alpha: false });
const RAMP = ".,-~:;=!*#$@", MW = 112, MH = 56, DEPTH = 5;

// Solid monogram: rasterise the initials, then extrude them into surface voxels with normals.
function buildModel() {
  const m = document.createElement("canvas"); m.width = MW; m.height = MH;
  const g = m.getContext("2d", { willReadFrequently: true });
  g.font = '900 52px "Arial Black",Arial,sans-serif'; g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = "#fff";
  g.fillText((S.first[0] + S.last[0]).toUpperCase(), MW / 2, MH / 2 + 2);
  const d = g.getImageData(0, 0, MW, MH).data, on = (a, b) => a >= 0 && b >= 0 && a < MW && b < MH && d[(b * MW + a) * 4 + 3] > 128 ? 1 : 0;
  const pts = [];
  for (let b = 0; b < MH; b++) for (let a = 0; a < MW; a++) {
    if (!on(a, b)) continue;
    const px = a - MW / 2, py = b - MH / 2;
    pts.push(px, py, DEPTH, 0, 0, 1, px, py, -DEPTH, 0, 0, -1);
    const nx = on(a - 1, b) - on(a + 1, b), ny = on(a, b - 1) - on(a, b + 1);
    if (nx || ny) {
      const l = Math.hypot(nx, ny);
      for (let z = -DEPTH + 1; z < DEPTH; z++) pts.push(px, py, z, nx / l, ny / l, 0);
    }
  }
  return new Float32Array(pts);
}
const model = buildModel();

let W, H, cols, rows, cw, lh, zbuf, lumi, dust, scale;
function size() {
  W = innerWidth; H = innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, 2), fs = W < 700 ? 8.5 : Math.max(10, Math.min(14, W / 110));
  c.width = W * dpr; c.height = H * dpr;
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.font = "bold " + fs + "px ui-monospace,Menlo,Consolas,monospace"; x.textBaseline = "top";
  cw = x.measureText("M").width; lh = fs * 1.08;
  cols = Math.ceil(W / cw); rows = Math.ceil(H / lh);
  zbuf = new Float32Array(cols * rows); lumi = new Int8Array(cols * rows);
  scale = Math.min(cols * .88 / MW, (rows * .72 / MH) * (lh / cw));
  dust = Array.from({ length: Math.round(cols * rows * .012) }, () => [Math.random() * cols | 0, Math.random() * rows | 0, RAMP[Math.random() * 3 | 0], Math.random() * 6.283]);
}

let ay = 0, ax = -.18, spin = 0, drag = false, px = 0, py = 0, tilt = 0;
c.addEventListener("pointerdown", e => { drag = true; px = e.clientX; py = e.clientY; c.setPointerCapture(e.pointerId); });
c.addEventListener("pointermove", e => {
  if (drag) { spin += (e.clientX - px) * .008; tilt += (e.clientY - py) * .006; px = e.clientX; py = e.clientY; }
  else if (e.pointerType === "mouse") tilt = (e.clientY / H - .5) * .6;
});
c.addEventListener("pointerup", () => drag = false);

const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
let last = 0;
function frame(t) {
  if (!still) requestAnimationFrame(frame);
  if (t - last < 32 || document.hidden) return;
  last = t;
  // Sway rather than spin, so the initials stay readable. A drag eases back afterwards.
  if (!drag) spin *= .97;
  ay = Math.sin(t / 1000 * .55) * .5 + spin;
  ax += (tilt - .16 - ax) * .06;
  zbuf.fill(-1e9); lumi.fill(0);
  const cy = Math.cos(ay), sy = Math.sin(ay), ca = Math.cos(ax), sa = Math.sin(ax);
  const ccx = cols / 2, ccy = rows * .44, aspect = cw / lh, LX = -.42, LY = -.62, LZ = .66;
  for (let i = 0; i < model.length; i += 6) {
    const a = model[i], b = model[i + 1], z0 = model[i + 2];
    const rx = a * cy + z0 * sy, rz0 = -a * sy + z0 * cy, ry = b * ca - rz0 * sa, rz = b * sa + rz0 * ca;
    const n0 = model[i + 3], n1 = model[i + 4], n2 = model[i + 5];
    const nrx = n0 * cy + n2 * sy, nz0 = -n0 * sy + n2 * cy, nry = n1 * ca - nz0 * sa, nrz = n1 * sa + nz0 * ca;
    const p = 150 / (150 - rz), sx = ccx + rx * p * scale | 0, syy = ccy + ry * p * scale * aspect | 0;
    if (sx < 0 || syy < 0 || sx >= cols || syy >= rows) continue;
    const o = syy * cols + sx;
    if (rz <= zbuf[o]) continue;
    zbuf[o] = rz;
    const light = nrx * LX + nry * LY + nrz * LZ;
    lumi[o] = 1 + Math.max(0, Math.min(11, (light * .5 + .5) * 12)) | 0;
  }
  x.fillStyle = "#050505"; x.fillRect(0, 0, W, H);
  const sec = t / 1000;
  x.fillStyle = "#3a3a36";
  for (const d of dust) if (Math.sin(sec * 1.4 + d[3]) > .1 && !lumi[d[1] * cols + d[0]]) x.fillText(d[2], d[0] * cw, d[1] * lh);
  // Three colour tiers per row, so a frame needs only a few text draws.
  const tiers = [["#c8a11a", 1, 4], ["#ffe14d", 5, 8], ["#fffbe6", 9, 12]];
  for (const [color, a, b] of tiers) {
    x.fillStyle = color;
    for (let r = 0; r < rows; r++) {
      let s = "", any = false;
      for (let q = 0; q < cols; q++) {
        const v = lumi[r * cols + q];
        if (v >= a && v <= b) { s += RAMP[v - 1]; any = true; } else s += " ";
      }
      if (any) x.fillText(s, 0, r * lh);
    }
  }
}
let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(size, 120); });
S.ready(() => { size(); requestAnimationFrame(frame); });
</script>
</body>
</html>
