<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2b53">
<style>
html,body{height:100%;margin:0;background:#1d2b53;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.ui{position:fixed;left:0;right:0;top:max(16px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px;pointer-events:none;text-align:center}
h1{margin:0;font-size:clamp(12px,1.3vw,15px);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#fff1e8;text-shadow:2px 2px 0 #7e2553}
.links{display:flex;gap:12px;pointer-events:auto}
a{color:#1d2b53;background:#ffec27;padding:9px 14px;text-decoration:none;font-weight:700;font-size:13px;letter-spacing:.08em;box-shadow:3px 3px 0 #7e2553;text-transform:uppercase}
a+a{background:#29adff}
a:hover,a:focus-visible{background:#fff1e8}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Pixel art: a red biplane tows a banner with this person's name over a beach at sunset"></canvas>
<div class="ui"><h1 id="role"></h1><div class="links"><a id="gh" rel="me noopener">GitHub</a><a id="li" rel="me noopener">LinkedIn</a></div></div>
<script src="../config.js"></script>
<script src="letters.js"></script>
<script>
{
const S = SITE, $ = id => document.getElementById(id);
$("role").textContent = S.role + " · Pilot"; $("gh").href = S.github; $("li").href = S.linkedin;
const c = $("c"), x = c.getContext("2d");
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
// A sunset palette in the PICO-8 colours.
const P = { navy: "#1d2b53", plum: "#7e2553", green: "#008751", brown: "#ab5236", grey: "#5f574f", light: "#c2c3c7", white: "#fff1e8", red: "#ff004d", orange: "#ffa300", yellow: "#ffec27", blue: "#29adff", lilac: "#83769c", pink: "#ff77a8", peach: "#ffccaa" };
const TEXT = LETTERS.dots(S.full); // one line, always: a banner never wraps
let PX, LW, LH, sky, lo, g, horizon, planeY, targetY;

// The static sky, drawn once per size at low resolution with ordered dithering between bands.
function layout() {
  const W = innerWidth, H = innerHeight;
  PX = Math.max(2, Math.round(Math.min(W, H) / 210));
  if (W / PX < TEXT.length + 48) PX = Math.max(1, Math.floor(W / (TEXT.length + 48)));
  LW = Math.ceil(W / PX); LH = Math.ceil(H / PX); horizon = Math.round(LH * .66);
  c.width = LW; c.height = LH;
  lo = c; g = c.getContext("2d");
  sky = document.createElement("canvas"); sky.width = LW; sky.height = LH;
  const s = sky.getContext("2d"), img = s.createImageData(LW, LH), hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const bands = [P.navy, P.lilac, P.pink, P.orange, P.peach].map(hex), BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  for (let y = 0; y < horizon; y++) for (let i = 0; i < LW; i++) {
    const t = Math.pow(y / horizon, 1.4) * (bands.length - 1), b = Math.floor(t), f = t - b, pick = f * 16 > BAYER[(y % 4) * 4 + (i % 4)] ? b + 1 : b;
    const col = bands[Math.min(bands.length - 1, pick)], o = (y * LW + i) * 4;
    img.data[o] = col[0]; img.data[o + 1] = col[1]; img.data[o + 2] = col[2]; img.data[o + 3] = 255;
  }
  s.putImageData(img, 0, 0);
  // A striped retro sun sitting on the horizon.
  const sx = Math.round(LW * .3), r = Math.round(Math.min(LW, LH) * .11);
  for (let y = -r; y <= 0; y++) {
    if (y > -r * .55 && (y + 200) % 4 < 2 - (y > -r * .25 ? 1 : 0)) continue;
    const w = Math.round(Math.sqrt(r * r - y * y));
    s.fillStyle = y < -r * .5 ? P.yellow : P.orange; s.fillRect(sx - w, horizon + y, w * 2, 1);
  }
  targetY = planeY = Math.round(LH * .3);
}

const clouds = Array.from({ length: 5 }, () => ({ x: Math.random(), y: .08 + Math.random() * .32, w: 14 + Math.random() * 22 | 0 }));
const birds = Array.from({ length: 3 }, () => ({ x: Math.random(), y: .15 + Math.random() * .3, p: Math.random() * 6 }));
const rect = (col, a, b, w, h) => { g.fillStyle = col; g.fillRect(Math.round(a), Math.round(b), w, h); };
function draw(t) {
  g.drawImage(sky, 0, 0);
  const v = 26; // ground speed, low-res pixels per second
  // Far islands, then clouds, then birds, each scrolling at its own depth.
  for (let i = 0; i < LW; i++) {
    const wx = i + t * v * .12, h = Math.max(0, Math.round(5 * Math.sin(wx * .045) + 4 * Math.sin(wx * .11) - 1));
    if (h) rect(P.plum, i, horizon - h, 1, h);
  }
  for (const cl of clouds) {
    const cx = ((cl.x * (LW + 80) - t * v * .3) % (LW + 80) + LW + 80) % (LW + 80) - 40, cy = Math.round(cl.y * LH);
    rect(P.peach, cx, cy, cl.w, 3); rect(P.peach, cx + 4, cy - 2, cl.w - 9, 2); rect(P.pink, cx + 2, cy + 3, cl.w - 3, 1);
  }
  for (const b of birds) {
    const bx = ((b.x * (LW + 40) - t * v * .55) % (LW + 40) + LW + 40) % (LW + 40) - 20, by = Math.round(b.y * LH + Math.sin(t * 2 + b.p) * 2), up = Math.sin(t * 9 + b.p) > 0;
    rect(P.navy, bx, by, 1, 1); rect(P.navy, bx - 1, by - (up ? 1 : 0), 1, 1); rect(P.navy, bx + 1, by - (up ? 1 : 0), 1, 1);
  }
  // Sea with moving glints and the sun's reflection.
  rect(P.navy, 0, horizon, LW, LH - horizon);
  const beach = Math.round(LH * .9);
  for (let y = horizon + 1; y < beach; y += 2) {
    const k = (y - horizon) / (beach - horizon);
    for (let i = 0; i < 5; i++) { const gx = ((i * 97 + y * 31 - t * v * (.4 + k)) % LW + LW) % LW; rect(k < .5 ? P.lilac : P.blue, gx, y, 3 + i % 3, 1); }
    const sx = Math.round(LW * .3), w = Math.round((1 - k) * LW * .08 + 2 + Math.sin(t * 3 + y) * 2);
    rect(y % 4 ? P.orange : P.yellow, sx - w / 2, y, w, 1);
  }
  // Beach with umbrellas, passing fastest.
  rect(P.peach, 0, beach, LW, LH - beach); rect(P.brown, 0, beach, LW, 1);
  for (let i = 0; i < 6; i++) {
    const ux = ((i * 61 - t * v) % (LW + 30) + LW + 30) % (LW + 30) - 15, uy = beach + 3;
    rect(P.grey, ux, uy - 5, 1, 7); rect(i % 2 ? P.red : P.blue, ux - 4, uy - 7, 9, 1); rect(i % 2 ? P.red : P.blue, ux - 3, uy - 8, 7, 1); rect(P.white, ux - 1, uy - 8, 3, 1);
  }

  // The biplane, flying right. The pointer sets its height.
  planeY += (targetY - planeY) * .05;
  const bw = TEXT.length + 6, ROPE = 14, py = Math.round(planeY + Math.sin(t * 1.6) * 2);
  const px = Math.round(Math.max(LW * .62, bw + ROPE + 16)); // keep the whole banner on screen
  rect(P.red, px - 8, py - 1, 13, 3); rect(P.red, px - 9, py - 4, 2, 4); rect(P.red, px - 11, py - 1, 3, 1);
  rect(P.orange, px - 5, py - 4, 10, 1); rect(P.orange, px - 5, py + 2, 10, 1);
  rect(P.white, px - 4, py - 3, 1, 2); rect(P.white, px + 3, py - 3, 1, 2);
  rect(P.light, px + 5, py - 1, 2, 3); rect(P.navy, px - 2, py - 2, 2, 1); rect(P.peach, px - 1, py - 3, 1, 1);
  rect(P.grey, px - 2, py + 3, 1, 1); rect(P.grey, px + 2, py + 3, 1, 1);
  rect((t * 30 | 0) % 2 ? P.white : P.light, px + 7, py - 3 + ((t * 30 | 0) % 2), 1, 5);
  // Tow rope with a little sag.
  const bx = px - 10 - ROPE, by = py + 1;
  for (let i = 0; i <= ROPE; i++) rect(P.grey, bx + i, by + Math.round(Math.sin(i / ROPE * Math.PI) * 2), 1, 1);
  // The banner ripples, more toward its tail. Columns facing away from the light are shaded.
  let prev = 0;
  for (let i = 0; i < bw; i++) {
    const fromFront = bw - 1 - i, amp = .3 + 1.8 * fromFront / bw, dy = Math.round(Math.sin(fromFront * .28 - t * 8) * amp), shade = dy > prev;
    prev = dy;
    const cx = bx - bw + i, top = by - 6 + dy;
    rect(P.red, cx, top, 1, 1); rect(P.red, cx, top + 12, 1, 1);
    rect(shade ? P.light : P.white, cx, top + 1, 1, 11);
    const col = TEXT[i - 3];
    if (col) col.forEach((on, r) => { if (on) rect(P.navy, cx, top + 3 + r, 1, 1); });
  }
}
let last = 0, clock = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = now; return; }
  const dt = Math.min(.1, (now - last) / 1000); last = now; clock += dt; acc += dt;
  if (acc < 1 / 30) return; acc = 0; // pixel art at 30 frames per second
  draw(clock);
}
addEventListener("pointermove", e => { targetY = Math.max(LH * .14, Math.min(LH * .55, e.clientY / PX)); }, { passive: true });
addEventListener("resize", () => { layout(); draw(clock); });
S.ready(() => { layout(); draw(0); if (!still) requestAnimationFrame(frame); });
}
</script>
</body>
</html>
