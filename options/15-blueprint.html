<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3a86">
<style>
:root{--paper:#0b3a86;--ink:#dcebff;--dim:#8fb6ea;--sig:#ffe14d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{display:flex;align-items:center;justify-content:center;min-height:100dvh;background-image:linear-gradient(#ffffff12 1px,#0000 1px),linear-gradient(90deg,#ffffff12 1px,#0000 1px),linear-gradient(#ffffff08 1px,#0000 1px),linear-gradient(90deg,#ffffff08 1px,#0000 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px}
svg{display:block;width:100%;height:auto;max-height:100dvh}
body.tall{align-items:flex-start}
body.tall svg{max-height:none}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
text{fill:var(--ink);font-family:inherit;font-size:13px}
.big{font:900 62px "Arial Black","Helvetica Neue",Arial,sans-serif;letter-spacing:-1.5px}
.dim{fill:var(--dim);font-size:12px}
.fig{font-size:14px;font-weight:700;letter-spacing:.14em}
.ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.thin{stroke-width:1;stroke:var(--dim)}
.wire{fill:none;stroke:var(--dim);stroke-width:1.5;stroke-linejoin:round}
.sig{fill:none;stroke:var(--sig);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:7 70;animation:flow 2.4s linear infinite;opacity:.95}
.sig.slow{animation-duration:3.3s}
@keyframes flow{to{stroke-dashoffset:-77}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.7s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.late{opacity:0;animation:fade .8s 1.1s forwards}
@keyframes fade{to{opacity:1}}
.part{cursor:default}
.hot .wire{stroke:var(--sig)}
body.lit .sig{opacity:.2}
body.lit .sig.on{opacity:1;stroke-width:3.2}
body.lit .fig-g.on .ln{stroke:var(--sig)}
a text{fill:var(--paper);font-weight:700;font-size:17px;letter-spacing:.08em}
a .pad{fill:var(--ink);transition:fill .15s}
a:hover .pad,a:focus-visible .pad{fill:var(--sig)}
a:focus-visible{outline:none}
@media (prefers-reduced-motion:reduce){.sig,.draw,.late{animation:none;stroke-dashoffset:0;opacity:1}.sig{display:none}}
</style>
</head>
<body>
<h1 id="sr"></h1>
<svg id="sheet" role="img" aria-label="Engineering drawing connecting sensors, a neural network, an airplane, an electronic circuit and a drone"></svg>
<script src="../config.js"></script>
<script src="shapes.js"></script>
<script>
{
const S = SITE, svg = document.getElementById("sheet"), NS = "http://www.w3.org/2000/svg";
document.getElementById("sr").textContent = S.full;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

// Two sheets, one per orientation. Everything else below is the same drawing.
const WIDE = {
  vw: 1400, vh: 860, frameZones: [8, 5],
  title: [46, 92], titleLines: [S.full.toUpperCase()], titleSize: 62,
  subtitle: [48, 122],
  sensors: { x: 62, y: 170, dx: 0, dy: 76 },
  u1: [400, 165, 320, 300],
  figs: { plane: [850, 60, 1.0], opamp: [830, 275, 1.0], drone: [1210, 300, .62] },
  scope: [62, 520, 430, 240],
  conn: [545, 560],
  block: [895, 610, 450, 196],
  wire: "h",
};
const TALL = {
  vw: 720, vh: 1840, frameZones: [4, 10],
  title: [40, 102], titleLines: [S.first.toUpperCase(), S.last.toUpperCase()], titleSize: 74,
  subtitle: [42, 212],
  sensors: { x: 40, y: 240, dx: 165, dy: 0 },
  u1: [150, 356, 420, 310],
  figs: { plane: [200, 722, 1.05], opamp: [190, 902, 1.05], drone: [262, 1088, .95] },
  scope: [40, 1346, 640, 170],
  conn: [255, 1534],
  block: [40, 1680, 640, 130],
  wire: "v",
};

const SENSORS = [["J3", "PITOT"], ["J4", "GPS / IMU"], ["J5", "LIDAR"], ["J6", "CAMERA"]];
const FIGS = { plane: ["FIG. 1", "PRIVATE PILOT", "AILERON · ELEVATOR"], opamp: ["FIG. 2", "ELECTRICAL", "VCC · GND · VOUT"], drone: ["FIG. 3", "DRONES", "ESC 1-4"] };

function render() {
  const L = innerWidth / innerHeight < 1 ? TALL : WIDE;
  document.body.classList.toggle("tall", L === TALL);
  svg.setAttribute("viewBox", "0 0 " + L.vw + " " + L.vh);
  let o = "";
  const path = (d, cls = "ln", extra = "") => '<path pathLength="1" class="' + cls + ' draw" d="' + d + '" ' + extra + "/>";
  const text = (x, y, s, cls = "", anchor = "start") => '<text x="' + x + '" y="' + y + '" class="' + cls + ' late" text-anchor="' + anchor + '">' + esc(s) + "</text>";

  // Sheet border with drawing zones.
  const m = 16, W = L.vw, H = L.vh;
  o += path("M" + m + " " + m + "H" + (W - m) + "V" + (H - m) + "H" + m + "Z");
  o += path("M" + (m + 12) + " " + (m + 12) + "H" + (W - m - 12) + "V" + (H - m - 12) + "H" + (m + 12) + "Z", "ln thin");
  const [zx, zy] = L.frameZones;
  for (let i = 0; i < zx; i++) { const x = m + 12 + (W - 2 * m - 24) * (i + .5) / zx; o += text(x, m + 9, String(i + 1), "dim", "middle"); o += text(x, H - m - 2, String(i + 1), "dim", "middle"); }
  for (let i = 0; i < zy; i++) { const y = m + 12 + (H - 2 * m - 24) * (i + .5) / zy, c = String.fromCharCode(65 + i); o += text(m + 6, y + 4, c, "dim", "middle"); o += text(W - m - 6, y + 4, c, "dim", "middle"); }

  // Title.
  L.titleLines.forEach((t, i) => { o += '<text x="' + L.title[0] + '" y="' + (L.title[1] + i * L.titleSize * .98) + '" class="big late" style="font-size:' + L.titleSize + 'px">' + esc(t) + "</text>"; });
  o += text(L.subtitle[0], L.subtitle[1], "MACHINE LEARNING · SOFTWARE · ELECTRICAL · FLIGHT", "dim");

  // Part positions, then wires between them.
  const [ux, uy, uw, uh] = L.u1, wires = [];
  const route = (a, b, viaV) => viaV
    ? "M" + a[0] + " " + a[1] + "V" + (a[1] + b[1]) / 2 + "H" + b[0] + "V" + b[1]
    : "M" + a[0] + " " + a[1] + "H" + (a[0] + b[0]) / 2 + "V" + b[1] + "H" + b[0];

  SENSORS.forEach(([ref, label], i) => {
    const x = L.sensors.x + i * L.sensors.dx, y = L.sensors.y + i * L.sensors.dy, w = 150, h = 52;
    o += path("M" + x + " " + y + "h" + w + "v" + h + "h-" + w + "z");
    o += text(x + 10, y + 21, ref, "dim"); o += text(x + 10, y + 40, label);
    if (L.wire === "h") wires.push({ d: route([x + w, y + h / 2], [ux, uy + 48 + i * 68], false), key: "in" });
    else wires.push({ d: route([x + w / 2, y + h], [ux + 60 + i * 100, uy], true), key: "in" });
  });

  // U1: the neural net IC.
  o += path("M" + ux + " " + uy + "h" + uw + "v" + uh + "h-" + uw + "z");
  for (let i = 0; i < 9; i++) {
    const px = ux + 22 + i * (uw - 44) / 8;
    o += path("M" + px + " " + uy + "v-10 M" + px + " " + (uy + uh) + "v10", "ln thin");
  }
  for (let i = 0; i < 8; i++) {
    const py = uy + 22 + i * (uh - 44) / 7;
    o += path("M" + ux + " " + py + "h-10 M" + (ux + uw) + " " + py + "h10", "ln thin");
  }
  o += text(ux + 14, uy + 26, "U1", "fig"); o += text(ux + uw - 14, uy + 26, "ML ENGINEER", "dim", "end");
  const ns = SHAPES.net, nsc = Math.min((uw - 60) / ns.w, (uh - 90) / ns.h), nx = ux + (uw - ns.w * nsc) / 2, ny = uy + 42;
  o += '<g transform="translate(' + nx + " " + ny + ") scale(" + nsc + ')">' + path(ns.d, "ln thin", 'vector-effect="non-scaling-stroke" id="brain"') + "</g>";
  o += text(ux + uw / 2, uy + uh - 16, "INFERENCE @ ALL THE HZ", "dim", "middle");

  // Figures: airplane, amplifier circuit, quadcopter.
  for (const key of ["plane", "opamp", "drone"]) {
    const [fx, fy, fs] = L.figs[key], sh = SHAPES[key], [num, lab, act] = FIGS[key], w = sh.w * fs, h = sh.h * fs;
    o += '<g class="fig-g part" data-k="' + key + '">';
    o += '<g transform="translate(' + fx + " " + fy + ") scale(" + fs + ')">' + path(sh.d, "ln", 'vector-effect="non-scaling-stroke"') + "</g>";
    // Dimension line under each drawing.
    o += path("M" + fx + " " + (fy + h + 14) + "H" + (fx + w) + " M" + fx + " " + (fy + h + 8) + "v12 M" + (fx + w) + " " + (fy + h + 8) + "v12", "ln thin");
    o += text(fx + w / 2, fy + h + 34, num + " " + lab, "fig", "middle");
    o += text(fx + w / 2, fy + h + 50, act, "dim", "middle");
    o += "</g>";
    const pin = key === "plane" ? 0 : key === "opamp" ? 2 : 1;
    if (L.wire === "h") {
      const start = [ux + uw, uy + 60 + pin * 90];
      // The drone's wire runs above the circuit and drops in from the top.
      if (key === "drone") wires.push({ d: "M" + start[0] + " " + start[1] + "H" + (start[0] + 68) + "V" + (fy - 54) + "H" + (fx + w / 2) + "V" + (fy - 6), key });
      else wires.push({ d: route(start, [fx - 8, fy + h / 2], false), key });
    } else {
      wires.push({ d: "M" + (ux + uw) + " " + (uy + 60 + pin * 90) + "H" + (ux + uw + 72 - pin * 22) + "V" + (fy + h / 2) + "H" + (fx + w + 6), key });
    }
  }

  // Oscilloscope.
  const [sx, sy, sw, sh2] = L.scope;
  o += path("M" + sx + " " + sy + "h" + sw + "v" + sh2 + "h-" + sw + "z");
  for (let i = 1; i < 8; i++) o += path("M" + (sx + i * sw / 8) + " " + sy + "v" + sh2, "ln thin", 'opacity=".4"');
  for (let i = 1; i < 4; i++) o += path("M" + sx + " " + (sy + i * sh2 / 4) + "h" + sw, "ln thin", 'opacity=".4"');
  o += '<polyline id="trace1" class="ln" style="stroke:var(--sig);stroke-width:2"/><polyline id="trace2" class="ln" style="stroke:#7dffdb;stroke-width:1.5"/>';
  o += text(sx + 10, sy + 20, "CH1 LOSS", "dim"); o += text(sx + 10, sy + 38, "CH2 VOUT", "dim");
  if (L.wire === "h") wires.push({ d: route([sx + sw, sy + 60], [ux, uy + uh - 20], false), key: "in" });
  else wires.push({ d: "M" + (sx + 20) + " " + sy + "V" + (uy + uh - 30) + "H" + ux, key: "in" });

  // Wires.
  let wireOut = "";
  wires.forEach((w, i) => {
    wireOut += '<path class="wire draw" pathLength="1" d="' + w.d + '"/>';
    wireOut += '<path class="sig late' + (i % 2 ? " slow" : "") + '" data-k="' + w.key + '" d="' + w.d + '" style="animation-delay:' + (-i * .37) + 's,1.1s"/>';
  });
  o = wireOut + o;

  // Connectors: the actual links.
  const [cx, cy] = L.conn;
  const conn = (x, y, ref, label, url) => '<a href="' + url + '" rel="me noopener" aria-label="' + label + '">' +
    '<rect class="pad" x="' + x + '" y="' + y + '" width="210" height="56"/>' +
    '<circle cx="' + (x + 22) + '" cy="' + (y + 28) + '" r="9" fill="#0b3a86"/>' +
    '<text x="' + (x + 44) + '" y="' + (y + 34) + '">' + ref + " " + label + "</text></a>";
  o += '<g class="late">' + conn(cx, cy, "J1", "GITHUB", S.github) + conn(cx, cy + 66, "J2", "LINKEDIN", S.linkedin) + "</g>";
  if (L === WIDE) o += path("M" + (ux + uw / 2 - 20) + " " + (uy + uh + 10) + "V" + (cy - 12) + "H" + (cx + 40) + "V" + cy, "wire");

  // Title block.
  const [bx, by, bw, bh] = L.block, rows = 4, rh = bh / rows;
  o += path("M" + bx + " " + by + "h" + bw + "v" + bh + "h-" + bw + "z");
  for (let i = 1; i < rows; i++) o += path("M" + bx + " " + (by + i * rh) + "h" + bw);
  o += path("M" + (bx + bw * .58) + " " + (by + rh) + "V" + (by + bh));
  const f = (x, r, k, v) => text(x + 8, by + r * rh + rh * .36, k, "dim") + text(x + 8, by + r * rh + rh * .8, v);
  o += text(bx + 8, by + rh * .68, S.full.toUpperCase(), "fig");
  o += f(bx, 1, "ROLE", S.role.toUpperCase()); o += f(bx + bw * .58, 1, "ALIAS", S.alias.toUpperCase());
  o += f(bx, 2, "DISCIPLINES", "SW / EE / ML / AERO"); o += f(bx + bw * .58, 2, "REV", "A");
  o += f(bx, 3, "APPROVED BY", S.first[0].toUpperCase() + ". " + S.last.toUpperCase()); o += f(bx + bw * .58, 3, "SHEET", "1 OF 1");

  svg.innerHTML = o;
  wireHover();
  scope = { sx, sy, sw, sh: sh2, a: svg.querySelector("#trace1"), b: svg.querySelector("#trace2") };
}

function wireHover() {
  svg.querySelectorAll(".fig-g").forEach(g => {
    const k = g.dataset.k;
    const on = v => {
      document.body.classList.toggle("lit", v); g.classList.toggle("on", v);
      svg.querySelectorAll('.sig[data-k="' + k + '"],.sig[data-k="in"]').forEach(s => s.classList.toggle("on", v));
    };
    g.addEventListener("pointerenter", () => on(true));
    g.addEventListener("pointerleave", () => on(false));
  });
}

// Oscilloscope: a falling training loss, restarting, against a sawtooth output voltage.
let scope, last = 0;
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
function tick(ms) {
  if (!still) requestAnimationFrame(tick);
  if (ms - last < 40 || document.hidden || !scope || !scope.a) return;
  last = ms;
  const t = ms / 1000, n = 90, pa = [], pb = [], s = scope;
  for (let i = 0; i <= n; i++) {
    const u = i / n, x = s.sx + u * s.sw;
    const phase = (u * 2 + t * .18) % 1;
    const loss = Math.exp(-phase * 5) + Math.sin(u * 90 + t * 14) * .02 * Math.exp(-phase * 2);
    pa.push(x.toFixed(1) + "," + (s.sy + s.sh * .86 - loss * s.sh * .62).toFixed(1));
    const gear = (u * 3 + t * .32) % 1, rpm = .3 + gear * .62 + Math.sin(u * 180 + t * 40) * .012;
    pb.push(x.toFixed(1) + "," + (s.sy + s.sh * .95 - rpm * s.sh * .85).toFixed(1));
  }
  s.a.setAttribute("points", pa.join(" "));
  s.b.setAttribute("points", pb.join(" "));
}
let lastTall = null, rt;
function maybeRender() {
  const tall = innerWidth / innerHeight < 1;
  if (tall !== lastTall) { lastTall = tall; render(); }
}
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(maybeRender, 120); });
S.ready(() => { maybeRender(); requestAnimationFrame(tick); });
}
</script>
</body>
</html>
