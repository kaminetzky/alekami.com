<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03030a">
<style>
html,body{height:100%;margin:0;background:#03030a;color:#fff;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.ui{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:0 clamp(16px,3vw,36px) max(22px,env(safe-area-inset-bottom));pointer-events:none;flex-wrap:wrap}
.tag{font-size:12px;letter-spacing:.1em;color:#a4b6d6;line-height:1.7}
.tag b{display:block;color:#fff;font-weight:600}
.links{display:flex;gap:10px;pointer-events:auto}
a{color:#03030a;background:#57f2c3;padding:11px 18px;text-decoration:none;font-weight:700;font-size:13px;letter-spacing:.06em;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
a+a{background:#ff5ca8}
a:hover,a:focus-visible{background:#fff}
#mode{position:fixed;top:max(18px,env(safe-area-inset-top));left:clamp(16px,3vw,36px);font-size:12px;letter-spacing:.2em;color:#a4b6d6;text-transform:uppercase}
</style>
</head>
<body>
<h1 id="sr"></h1>
<canvas id="c" aria-hidden="true"></canvas>
<div id="mode"></div>
<div class="ui">
  <div class="tag"><b id="role"></b>Move your pointer. Scatter the swarm.</div>
  <div class="links"><a id="gh" rel="me noopener">GitHub</a><a id="li" rel="me noopener">LinkedIn</a></div>
</div>
<script src="../config.js"></script>
<script>
const S = SITE, $ = id => document.getElementById(id);
$("sr").textContent = S.full; $("role").textContent = S.role; $("gh").href = S.github; $("li").href = S.linkedin;
const c = $("c"), gl = c.getContext("webgl", { antialias: false, alpha: false, powerPreference: "high-performance" });
if (!gl) { S.noWebGL(); throw new Error("WebGL unavailable"); }
const narrowDevice = Math.min(innerWidth, innerHeight) < 700;
const COUNT = narrowDevice ? 16000 : 42000, SHARE = [.25, .55, 1];
let drawn = Math.round(COUNT * SHARE[SITE.tier(gl)]);
const govern = SITE.governor(SITE.tier(gl), l => { drawn = Math.round(COUNT * SHARE[l]); });

const VS = `
attribute vec3 aA, aB; attribute vec4 aS;
uniform float uMix, uT, uAsp, uDpr, uRotA, uRotB; uniform vec2 uMouse, uTilt;
varying vec3 vC; varying float vA;
vec3 rot(vec3 p, float a){ float c=cos(a), s=sin(a); return vec3(c*p.x+s*p.z, p.y, -s*p.x+c*p.z); }
void main(){
  float k = smoothstep(aS.x*.45, aS.x*.45+.55, uMix);
  vec3 a = rot(aA, uRotA), b = rot(aB, uRotB);
  vec3 p = mix(a, b, k);
  float burst = sin(k*3.14159);
  float w = uT*.6 + aS.y*6.283;
  p += burst * vec3(sin(w+p.y*3.), cos(w*1.3+p.x*3.), sin(w*.7+p.x*2.)) * (.25 + aS.z*.55);
  p += vec3(sin(uT+aS.y*40.), cos(uT*.9+aS.z*40.), 0.) * .0035;
  p.x += uTilt.x*p.z*.5; p.y += uTilt.y*p.z*.5;
  float pers = 3./(3.-p.z);
  vec2 q = p.xy*pers;
  vec2 d = q-uMouse; float l = length(d)+.001;
  float push = .3*exp(-l*l*14.);
  q += d/l*push;
  gl_Position = vec4(q.x/uAsp, q.y, 0., 1.);
  gl_PointSize = (1.35+aS.w*1.4)*uDpr*pers;
  vec3 c1=vec3(.34,.95,.76), c2=vec3(1.,.36,.66), c3=vec3(.45,.6,1.);
  vC = mix(mix(c1,c2,clamp(.5+q.x/uAsp*.6-q.y*.25,0.,1.)), c3, step(.72,aS.y)*.8);
  vC = mix(vC, c2, smoothstep(0.,1.,burst + push*2.5)*.9);
  vA = 1.15+push*2.;
}`;
const FS = `
precision mediump float; varying vec3 vC; varying float vA;
void main(){ float d=length(gl_PointCoord-.5); if(d>.5) discard; gl_FragColor=vec4(vC*vA*smoothstep(.5,.1,d),1.); }`;

function compile(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; }
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
const U = n => gl.getUniformLocation(prog, n);
const u = { mix: U("uMix"), t: U("uT"), asp: U("uAsp"), dpr: U("uDpr"), mouse: U("uMouse"), tilt: U("uTilt"), ra: U("uRotA"), rb: U("uRotB") };
const bufA = gl.createBuffer(), bufB = gl.createBuffer(), bufS = gl.createBuffer();
const locA = gl.getAttribLocation(prog, "aA"), locB = gl.getAttribLocation(prog, "aB"), locS = gl.getAttribLocation(prog, "aS");
const seed = new Float32Array(COUNT * 4).map(() => Math.random());
gl.bindBuffer(gl.ARRAY_BUFFER, bufS); gl.bufferData(gl.ARRAY_BUFFER, seed, gl.STATIC_DRAW);
gl.enableVertexAttribArray(locS); gl.vertexAttribPointer(locS, 4, gl.FLOAT, false, 0, 0);
gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.clearColor(.012, .012, .04, 1);

let asp = 1, dpr = 1;
function shuffled(pts) {
  const out = new Float32Array(COUNT * 3), n = pts.length / 3;
  for (let i = 0; i < COUNT; i++) {
    const j = (Math.random() * n | 0) * 3;
    out[i * 3] = pts[j]; out[i * 3 + 1] = pts[j + 1]; out[i * 3 + 2] = pts[j + 2];
  }
  return out;
}
function textShape(lines) {
  const W = 1000, H = Math.round(W / asp), cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d", { willReadFrequently: true }), face = '900 100px "Arial Black","Helvetica Neue",Arial,sans-serif';
  x.font = face;
  const widest = Math.max(...lines.map(l => x.measureText(l).width));
  const size = Math.min(100 * W * .9 / widest, H * .62 / lines.length);
  x.font = face.replace("100px", size + "px");
  x.textAlign = "center"; x.textBaseline = "middle"; x.fillStyle = "#fff";
  lines.forEach((l, i) => x.fillText(l, W / 2, H * .47 + (i - (lines.length - 1) / 2) * size * 1.02));
  const d = x.getImageData(0, 0, W, H).data, pts = [];
  for (let py = 0; py < H; py += 2) for (let px = 0; px < W; px += 2) {
    if (d[(py * W + px) * 4 + 3] > 128) pts.push((px / W * 2 - 1) * asp, 1 - py / H * 2, (Math.random() - .5) * .02);
  }
  return shuffled(pts);
}
function netShape() {
  const r = Math.min(asp, 1) * .92, layers = [4, 7, 9, 7, 3], nodes = [];
  layers.forEach((n, l) => {
    for (let i = 0; i < n; i++) nodes.push({ l, x: (l / (layers.length - 1) * 2 - 1) * r * 1.05, y: (i - (n - 1) / 2) * (Math.min(r, .85) / 4.4), z: Math.sin(i + l) * .12 });
  });
  const pts = [];
  for (let k = 0; k < COUNT; k++) {
    if (Math.random() < .62) {
      const a = nodes[Math.random() * nodes.length | 0], next = nodes.filter(n => n.l === a.l + 1);
      if (next.length) {
        const b = next[Math.random() * next.length | 0], t = Math.random();
        pts.push(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, a.z + (b.z - a.z) * t);
        continue;
      }
    }
    const a = nodes[Math.random() * nodes.length | 0], s = .05 * Math.sqrt(Math.random()), o = Math.random() * 6.283;
    pts.push(a.x + Math.cos(o) * s, a.y + Math.sin(o) * s, a.z);
  }
  return Float32Array.from(pts);
}
function knotShape() {
  const out = new Float32Array(COUNT * 3), R = Math.min(asp, 1) * .3;
  for (let i = 0; i < COUNT; i++) {
    const t = Math.random() * 6.283, p = 2, q = 3, tube = .13 * Math.sqrt(Math.random()), o = Math.random() * 6.283;
    const r = R * (2 + Math.cos(q * t));
    out[i * 3] = r * Math.cos(p * t) + Math.cos(o) * tube;
    out[i * 3 + 1] = r * Math.sin(p * t) + Math.sin(o) * tube;
    out[i * 3 + 2] = -R * 1.3 * Math.sin(q * t) + Math.sin(o + 1) * tube;
  }
  return out;
}
function sphereShape() {
  const out = new Float32Array(COUNT * 3), R = Math.min(asp, 1) * .8, ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < COUNT; i++) {
    const y = 1 - 2 * (i + .5) / COUNT, r = Math.sqrt(1 - y * y), o = i * ga;
    const bump = 1 + .05 * Math.sin(o * 3) * Math.sin(y * 18);
    out[i * 3] = Math.cos(o) * r * R * bump; out[i * 3 + 1] = y * R * bump; out[i * 3 + 2] = Math.sin(o) * r * R * bump;
  }
  return out;
}

let shapes, idx = 0, cycleStart = 0;
function build() {
  dpr = Math.min(devicePixelRatio || 1, 1.5);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  gl.viewport(0, 0, c.width, c.height);
  asp = innerWidth / innerHeight;
  const narrow = asp < .9;
  shapes = [
    { name: "you", pts: textShape(S.lines(narrow)), spin: 0, hold: 7500 },
    { name: "neural network", pts: netShape(), spin: .25, hold: 3800 },
    { name: S.alias, pts: textShape([S.alias.toUpperCase()]), spin: 0, hold: 4000 },
    { name: "trefoil knot", pts: knotShape(), spin: .6, hold: 3800 },
    { name: "ml engineer", pts: textShape(narrow ? ["ML", "ENGINEER"] : ["ML ENGINEER"]), spin: 0, hold: 4000 },
    { name: "planet", pts: sphereShape(), spin: .45, hold: 3800 },
  ];
  idx = 0; cycleStart = performance.now(); bind();
}
function setAttr(buf, loc, data) {
  gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
}
function bind() {
  setAttr(bufA, locA, shapes[idx].pts);
  setAttr(bufB, locB, shapes[(idx + 1) % shapes.length].pts);
  $("mode").textContent = "/ " + shapes[idx].name;
}

let mx = 9, my = 9, tmx = 9, tmy = 9, tilt = [0, 0];
addEventListener("pointermove", e => {
  tmx = (e.clientX / innerWidth * 2 - 1) * asp; tmy = 1 - e.clientY / innerHeight * 2;
  tilt = [e.clientX / innerWidth - .5, .5 - e.clientY / innerHeight];
}, { passive: true });
addEventListener("pointerup", e => { if (e.pointerType !== "mouse") { tmx = 9; tmy = 9; } });
addEventListener("pointerleave", () => { tmx = 9; tmy = 9; });

const MORPH = 1900, still = matchMedia("(prefers-reduced-motion: reduce)").matches;
let spinA = 0, spinB = 0, prev = 0;
function frame(t) {
  if (!still) requestAnimationFrame(frame);
  if (document.hidden) { prev = t; cycleStart += 16; return; }
  govern(t);
  const dt = Math.min(.05, (t - prev) / 1000); prev = t;
  let e = t - cycleStart, s = shapes[idx];
  if (e > s.hold + MORPH) {
    idx = (idx + 1) % shapes.length; cycleStart = t; e = 0; bind(); s = shapes[idx];
    spinA = spinB; spinB = 0;
  }
  const raw = Math.max(0, (e - s.hold) / MORPH), m = raw * raw * (3 - 2 * raw);
  const next = shapes[(idx + 1) % shapes.length];
  spinA = s.spin ? spinA + dt * s.spin : 0;
  spinB = next.spin ? spinB + (raw > 0 ? dt * next.spin : 0) : 0;
  mx += (tmx - mx) * .12; my += (tmy - my) * .12;
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform1f(u.mix, m); gl.uniform1f(u.t, t / 1000); gl.uniform1f(u.asp, asp); gl.uniform1f(u.dpr, dpr);
  gl.uniform2f(u.mouse, mx, my); gl.uniform2f(u.tilt, tilt[0], tilt[1]);
  gl.uniform1f(u.ra, spinA); gl.uniform1f(u.rb, spinB);
  gl.drawArrays(gl.POINTS, 0, drawn);
}
let rt, bw = innerWidth;
S.ready(() => { bw = innerWidth; build(); requestAnimationFrame(frame); });
addEventListener("resize", () => { if (innerWidth === bw) return; bw = innerWidth; clearTimeout(rt); rt = setTimeout(build, 180); });
</script>
</body>
</html>
