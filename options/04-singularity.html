<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<style>
html,body{height:100%;margin:0;background:#000;color:#fff;overflow:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:radial-gradient(circle,#2a1305,#000 45%)}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:max(22px,env(safe-area-inset-top)) 16px max(26px,env(safe-area-inset-bottom));pointer-events:none}
.top{font:12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.32em;color:#ffffffb0;text-transform:uppercase}
h1{margin:0;font-weight:200;font-size:clamp(30px,6.4vw,104px);letter-spacing:.12em;line-height:1.05;text-transform:uppercase;text-shadow:0 0 40px #ff9c4a90,0 2px 12px #000}
.role{margin:12px 0 22px;font:13px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;color:#ffd9b3;text-transform:uppercase}
.links{display:flex;gap:12px;justify-content:center;pointer-events:auto}
a{color:#fff;text-decoration:none;font-size:14px;letter-spacing:.14em;text-transform:uppercase;padding:12px 24px;border:1px solid #ffffff55;border-radius:99px;background:#ffffff12;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .2s,color .2s}
a:hover,a:focus-visible{background:#ffb066;color:#000}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="ui">
  <div class="top" id="alias"></div>
  <div>
    <h1 id="name"></h1>
    <div class="role" id="role"></div>
    <div class="links"><a id="gh" rel="me noopener">GitHub</a><a id="li" rel="me noopener">LinkedIn</a></div>
  </div>
</div>
<script src="../config.js"></script>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 R; uniform float T; uniform vec2 M;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<3;i++){s+=a*noise(p);p*=2.1;a*=.5;}return s;}
vec3 stars(vec3 d){
 vec2 uv=vec2(atan(d.z,d.x),asin(clamp(d.y,-1.,1.)))*48.;
 vec2 g=floor(uv),f=fract(uv)-.5;float n=h21(g);
 if(n<.93)return vec3(0.);
 float s=smoothstep(.2,0.,length(f-(vec2(h21(g+1.),h21(g+2.))-.5)*.5));
 return s*mix(vec3(1.,.8,.6),vec3(.7,.85,1.),h21(g+3.))*(n-.9)*12.;
}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*R)/min(R.y,R.x*1.15);
 uv.y-=.09;
 float yaw=.35*sin(T*.05)+M.x*.9,pitch=.2+M.y*.28;
 vec3 ro=vec3(sin(yaw)*cos(pitch),sin(pitch),-cos(yaw)*cos(pitch))*16.;
 vec3 w=normalize(-ro),u=normalize(cross(vec3(0,1,0),w)),up=cross(w,u);
 vec3 v=normalize(uv.x*u+uv.y*up+1.55*w),p=ro;
 float h2=dot(cross(p,v),cross(p,v));
 vec3 col=vec3(0.);float a=0.;bool swallowed=false;
 for(int i=0;i<72;i++){
  float r2=dot(p,p),r=sqrt(r2);
  if(r<1.){swallowed=true;break;}
  if(r>32.&&dot(p,v)>0.)break;
  float dt=clamp(r*.09,.04,1.6);
  vec3 prev=p;
  v+=-1.5*h2*p/(r2*r2*r)*dt;
  p+=v*dt;
  if(prev.y*p.y<0.){
   vec3 q=mix(prev,p,prev.y/(prev.y-p.y));
   float qr=length(q.xz);
   if(qr>1.9&&qr<8.5){
    float ang=atan(q.z,q.x)+T*2.4/pow(qr,1.5);
    float d=fbm(vec2(ang*5.,qr*1.6-T*.25))*1.5;
    d*=smoothstep(1.9,2.6,qr)*smoothstep(8.5,4.4,qr);
    vec3 tan=normalize(vec3(-q.z,0.,q.x));
    float dop=1.+.62*dot(tan,normalize(v));
    dop=dop*dop*dop;
    float heat=clamp(1.15-qr/8.,0.,1.);
    vec3 c=mix(vec3(1.,.27,.05),vec3(1.,.74,.42),heat)*(.7+1.5*heat*heat);
    float cover=clamp(d*1.1,0.,1.);
    col+=(1.-a)*c*cover*dop*1.15;
    a+=(1.-a)*cover*.82;
   }
  }
 }
 if(!swallowed)col+=(1.-a)*stars(normalize(v));
 col=1.-exp(-col*1.25);
 col=pow(col,vec3(.85));
 gl_FragColor=vec4(col,1.);
}
</script>
<script>
const S = SITE, $ = id => document.getElementById(id);
$("name").textContent = S.full; $("alias").textContent = S.alias; $("role").textContent = S.role;
$("gh").href = S.github; $("li").href = S.linkedin;
const c = $("c"), gl = c.getContext("webgl", { antialias: false, alpha: false, powerPreference: "high-performance" });
if (gl) {
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, "attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}"));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, $("fs").textContent));
  gl.linkProgram(prog); gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.bindAttribLocation(prog, 0, "a"); gl.linkProgram(prog); gl.useProgram(prog);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const uR = gl.getUniformLocation(prog, "R"), uT = gl.getUniformLocation(prog, "T"), uM = gl.getUniformLocation(prog, "M");

  // Render resolution adapts to the frame rate, so slow phones stay smooth.
  let scale = Math.min(devicePixelRatio || 1, 1.5) * [.32, .5, .7][S.tier(gl)], mx = 0, my = 0, tx = 0, ty = 0;
  function size() {
    c.width = Math.max(2, innerWidth * scale | 0); c.height = Math.max(2, innerHeight * scale | 0);
    gl.viewport(0, 0, c.width, c.height);
  }
  addEventListener("resize", size); size();
  addEventListener("pointermove", e => { tx = e.clientX / innerWidth * 2 - 1; ty = e.clientY / innerHeight * 2 - 1; }, { passive: true });
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let last = 0, acc = 0, frames = 0;
  function draw(t) {
    if (!still) requestAnimationFrame(draw);
    if (document.hidden) { last = t; return; }
    acc += t - last; last = t; frames++;
    if (frames === 24) {
      const ms = acc / frames; acc = 0; frames = 0;
      if (ms > 24 && scale > .3) { scale = Math.max(.3, scale * .8); size(); }
      else if (ms < 17.5 && scale < Math.min(devicePixelRatio || 1, 1.5) * .9) { scale *= 1.08; size(); }
    }
    mx += (tx - mx) * .04; my += (ty - my) * .04;
    gl.uniform2f(uR, c.width, c.height); gl.uniform1f(uT, 40 + t / 1000); gl.uniform2f(uM, mx, my);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(draw);
}
</script>
</body>
</html>
