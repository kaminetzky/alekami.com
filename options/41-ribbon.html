<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06000c">
<style>
html,body{height:100%;margin:0;background:#06000c;color:#fff;overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;text-align:center;padding:0 16px}
h1{margin:0;font-size:12px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:#d9b8ff}
.links{display:flex;gap:10px;pointer-events:auto}
a{color:#fff;padding:10px 20px;border-radius:999px;text-decoration:none;font-weight:600;font-size:14px;background:linear-gradient(90deg,#ff2bd6,#8b4dff);box-shadow:0 0 18px #ff2bd666}
a+a{background:linear-gradient(90deg,#8b4dff,#00e5ff);box-shadow:0 0 18px #00e5ff55}
a:hover,a:focus-visible{filter:brightness(1.25)}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="A glowing jet writes this person's name in the dark as one twisting neon ribbon"></canvas>
<div class="ui"><h1 id="role"></h1><div class="links"><a id="gh" rel="me noopener">GitHub</a><a id="li" rel="me noopener">LinkedIn</a></div></div>
<script src="../config.js"></script>
<script src="letters.js"></script>
<script src="gl3d.js"></script>
<script>
{
const S = SITE, G3 = GL3D, $ = id => document.getElementById(id);
$("role").textContent = S.role + " · Pilot"; $("gh").href = S.github; $("li").href = S.linkedin;
const c = $("c"), gl = c.getContext("webgl", { antialias: true, alpha: false });
if (!gl) { S.noWebGL(); throw new Error("WebGL unavailable"); }
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const VS = "attribute vec3 aP; attribute vec4 aC; uniform mat4 uM; uniform float uPx, uA; varying vec4 vC; void main(){ vec4 q=uM*vec4(aP,1.); gl_Position=q; gl_PointSize=clamp(uPx/q.w,1.,40.); vC=aC; vC.a*=uA; }";
const flatP = G3.program(gl, VS, "precision mediump float; varying vec4 vC; void main(){ gl_FragColor=vec4(vC.rgb*vC.a,1.); }");
const dotP = G3.program(gl, VS, "precision mediump float; varying vec4 vC; void main(){ vec2 p=gl_PointCoord-.5; float d=dot(p,p)*4.; gl_FragColor=vec4(vC.rgb*vC.a*min(1.,exp(-d*3.)*.6+exp(-d*25.)),1.); }");
const ribbonBuf = gl.createBuffer(), coreBuf = gl.createBuffer(), dyn = gl.createBuffer();
const STOPS = [[1, .17, .84], [.55, .3, 1], [0, .9, 1], [.55, .3, 1], [1, .17, .84]];
const col = u => { u = (u % 1 + 1) % 1 * 4; const i = u | 0, f = u - i, a = STOPS[i], b = STOPS[i + 1]; return [0, 1, 2].map(k => a[k] + (b[k] - a[k]) * f); };

// The name as one flight path. Pen-down legs leave a twisting ribbon; pen-up legs leave nothing.
let path = [], ribbonCount = [], coreCount = [], NW = 0, LIFT = 0;
function build() {
  const narrow = innerWidth / innerHeight < 1, p = LETTERS.path(S.lines(narrow), .2), s = 60, HW = 24;
  NW = p.width * s; LIFT = 0;
  path = p.pts.map(([a, b, down], i) => ({ p: [a * s, b * s, 90 * Math.sin(i * .035)], down, phi: i * .07 }));
  const rib = [], core = [];
  let along = 0;
  path.forEach((q, i) => {
    const a = path[Math.max(0, i - 1)].p, b = path[Math.min(path.length - 1, i + 1)].p, t = G3.norm(G3.sub(b, a));
    const n2 = G3.norm([-t[1], t[0], 0]), cp = Math.cos(q.phi), sp = Math.sin(q.phi);
    q.w = [n2[0] * cp * HW, n2[1] * cp * HW, sp * HW]; q.shade = .35 + .65 * Math.abs(cp);
    if (i && q.down && path[i - 1].down) along += Math.hypot(q.p[0] - path[i - 1].p[0], q.p[1] - path[i - 1].p[1]);
    q.c = col(along / 2600);
  });
  for (let i = 1; i < path.length; i++) {
    const A = path[i - 1], B = path[i];
    if (A.down && B.down) {
      const v = (Q, sgn) => [Q.p[0] + Q.w[0] * sgn, Q.p[1] + Q.w[1] * sgn, Q.p[2] + Q.w[2] * sgn, ...Q.c.map(k => k * Q.shade), 1];
      rib.push(...v(A, 1), ...v(B, 1), ...v(B, -1), ...v(A, 1), ...v(B, -1), ...v(A, -1));
      core.push(...A.p, 1, .95, 1, .9, ...B.p, 1, .95, 1, .9);
    }
    ribbonCount[i] = rib.length / 7; coreCount[i] = core.length / 7;
  }
  ribbonCount[0] = coreCount[0] = 0;
  gl.bindBuffer(gl.ARRAY_BUFFER, ribbonBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(rib), gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, coreBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(core), gl.STATIC_DRAW);
}
const stars = new Float32Array(Array.from({ length: 300 }, () => { const a = Math.random() * 6.28, e = Math.random() * 1.4 - .3, r = 12000; return [Math.sin(a) * Math.cos(e) * r, Math.sin(e) * r, -Math.cos(a) * Math.cos(e) * r, .8, .7, 1, .2 + Math.random() * .5]; }).flat());
function drawStatic(prog, buf, mode, count, U) {
  if (!count) return;
  gl.useProgram(prog); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  const aP = gl.getAttribLocation(prog, "aP"), aC = gl.getAttribLocation(prog, "aC");
  gl.enableVertexAttribArray(aP); gl.vertexAttribPointer(aP, 3, gl.FLOAT, false, 28, 0);
  gl.enableVertexAttribArray(aC); gl.vertexAttribPointer(aC, 4, gl.FLOAT, false, 28, 12);
  gl.uniformMatrix4fv(gl.getUniformLocation(prog, "uM"), false, U.uM); gl.uniform1f(gl.getUniformLocation(prog, "uPx"), U.uPx); gl.uniform1f(gl.getUniformLocation(prog, "uA"), U.uA);
  gl.drawArrays(mode, 0, count);
  gl.disableVertexAttribArray(aP); gl.disableVertexAttribArray(aC);
}

let W, H, aspect = 1, sparks = [];
function size() {
  W = innerWidth; H = innerHeight; aspect = W / H;
  const dpr = Math.min(devicePixelRatio || 1, 2); c.width = W * dpr; c.height = H * dpr; gl.viewport(0, 0, c.width, c.height);
}
// Timeline: write for about 26 seconds, hold, fade out, write again.
const WRITE = 26, HOLD = 8, FADE = 2;
function render(t, dt) {
  const cyc = t % (WRITE + HOLD + FADE), k = Math.min(path.length - 1, Math.floor(cyc / WRITE * (path.length - 1))), alpha = cyc > WRITE + HOLD ? 1 - (cyc - WRITE - HOLD) / FADE : 1;
  const head = path[k].p, fov = .9, D = NW * .5 / Math.tan(fov / 2) / Math.min(aspect, 1.6) * 1.32, a = .3 * Math.sin(t * .13);
  const eye = [Math.sin(a) * D + head[0] * .06, 90 + 70 * Math.sin(t * .21), Math.cos(a) * D], P = G3.perspective(fov, aspect, 10, 30000);
  const U = { uM: G3.mul(P, G3.lookAt(eye, [head[0] * .04, 0, 0])), uPx: 30 * (c.height / 2) / Math.tan(fov / 2), uA: alpha };
  gl.clearColor(.024, 0, .047, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  G3.draw(gl, dotP, dyn, stars, [["aP", 3], ["aC", 4]], gl.POINTS, stars.length / 7, Object.assign({}, U, { uPx: U.uPx * .3, uA: 1 }));
  drawStatic(flatP, ribbonBuf, gl.TRIANGLES, ribbonCount[k] || 0, U);
  drawStatic(flatP, coreBuf, gl.LINES, coreCount[k] || 0, U);
  // The jet: a hot point at the head of the ribbon, shedding sparks while it writes.
  if (cyc < WRITE) {
    for (let i = 0; i < 3; i++) sparks.push({ p: head.slice(), v: [(Math.random() - .5) * 120, (Math.random() - .5) * 120, (Math.random() - .5) * 120], life: 1, c: path[k].c });
    const jet = new Float32Array([...head, 1, 1, 1, 1.4]);
    G3.draw(gl, dotP, dyn, jet, [["aP", 3], ["aC", 4]], gl.POINTS, 1, Object.assign({}, U, { uPx: U.uPx * 1.6, uA: 1 }));
  }
  sparks = sparks.filter(s => (s.life -= dt * 1.4) > 0);
  if (sparks.length) {
    const sd = new Float32Array(sparks.length * 7);
    sparks.forEach((s, i) => { for (let j = 0; j < 3; j++) s.p[j] += s.v[j] * dt; sd.set([...s.p, ...s.c, s.life * .8], i * 7); });
    G3.draw(gl, dotP, dyn, sd, [["aP", 3], ["aC", 4]], gl.POINTS, sparks.length, Object.assign({}, U, { uPx: U.uPx * .35, uA: 1 }));
  }
}
let last = 0, clock = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = now; return; }
  const dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;
  render(clock, dt);
}
addEventListener("resize", () => { size(); build(); if (still) render(WRITE + 1, 0); });
S.ready(() => { size(); build(); if (still) render(WRITE + 1, 0); else requestAnimationFrame(frame); });
}
</script>
</body>
</html>
