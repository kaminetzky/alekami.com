<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04030d">
<style>
html,body{height:100%;margin:0;background:#04030d;color:#fff;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(20px,env(safe-area-inset-top)) clamp(16px,3vw,40px) max(20px,env(safe-area-inset-bottom))}
h1{margin:0;font:900 clamp(38px,8.4vw,132px)/.92 "Arial Black","Helvetica Neue",Arial,sans-serif;letter-spacing:-.04em;text-transform:uppercase;background:linear-gradient(100deg,#4affc3,#6f9dff 45%,#ff5ca8);-webkit-background-clip:text;background-clip:text;color:transparent}
.role{margin:10px 0 0;font-size:clamp(12px,1.3vw,16px);letter-spacing:.14em;color:#b9c3e6;text-transform:uppercase}
.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
ul{list-style:none;margin:0;padding:0;font-size:12px;line-height:1.7;min-width:180px}
li{display:flex;justify-content:space-between;gap:18px}
li i{font-style:normal}
.links{display:flex;gap:10px;pointer-events:auto}
a{color:#04030d;background:#4affc3;padding:12px 20px;text-decoration:none;font-weight:700;font-size:14px}
a+a{background:#ff5ca8}
a:hover,a:focus-visible{background:#fff}
@media (max-width:700px){h1{font-size:11.5vw}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="ui">
  <div><h1 id="name"></h1><p class="role" id="role"></p></div>
  <div class="foot">
    <ul id="legend" aria-hidden="true"></ul>
    <div class="links"><a id="gh" rel="me noopener">GitHub</a><a id="li" rel="me noopener">LinkedIn</a></div>
  </div>
</div>
<script src="../config.js"></script>
<script>
const S = SITE, $ = id => document.getElementById(id);
$("name").innerHTML = S.first + "<br>" + S.last; $("role").textContent = S.role;
$("gh").href = S.github; $("li").href = S.linkedin;
const c = $("c"), gl = c.getContext("webgl", { antialias: true, alpha: false, powerPreference: "high-performance" });
if (!gl) { S.noWebGL(); throw new Error("WebGL unavailable"); }
const RES = [.55, .8, 1];
let level = S.tier(gl);
const govern = S.governor(level, l => { level = l; size(); });

const VS = `
attribute vec3 aP; attribute vec3 aC;
uniform float uRot, uTilt, uAsp, uSize, uZoom;
varying vec3 vC;
void main(){
  float cr=cos(uRot), sr=sin(uRot), ct=cos(uTilt), st=sin(uTilt);
  vec3 p=vec3(cr*aP.x+sr*aP.z, aP.y, -sr*aP.x+cr*aP.z);
  p=vec3(p.x, ct*p.y-st*p.z, st*p.y+ct*p.z);
  float w=2.5+p.z;
  float fog=clamp(1.5-(w-1.6)*.55,.12,1.);
  gl_Position=vec4(p.x*uZoom/uAsp, (p.y-.34)*uZoom, 0., w*.5);
  gl_Position.xy*=1.;
  gl_PointSize=uSize/w*2.;
  vC=aC*fog;
}`;
const FS = `precision mediump float; varying vec3 vC; void main(){ gl_FragColor=vec4(vC,1.); }`;
function compile(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; }
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
const aP = gl.getAttribLocation(prog, "aP"), aC = gl.getAttribLocation(prog, "aC");
const U = n => gl.getUniformLocation(prog, n);
const uRot = U("uRot"), uTilt = U("uTilt"), uAsp = U("uAsp"), uSize = U("uSize"), uZoom = U("uZoom");
gl.enableVertexAttribArray(aP); gl.enableVertexAttribArray(aC);
gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.clearColor(.016, .012, .05, 1);
const bindLayout = () => { gl.vertexAttribPointer(aP, 3, gl.FLOAT, false, 24, 0); gl.vertexAttribPointer(aC, 3, gl.FLOAT, false, 24, 12); };

// The loss surface: a bowl with bumps and two minima, one deeper than the other.
const gauss = (x, z, cx, cz, s) => Math.exp(-((x - cx) ** 2 + (z - cz) ** 2) / (2 * s * s));
const loss = (x, z) => .17 * Math.sin(3.1 * x + 1) * Math.cos(2.7 * z) + .05 * Math.sin(8 * x) * Math.sin(7 * z + 1) + .3 * (x * x + z * z)
  - .62 * gauss(x, z, .36, .24, .26) - .42 * gauss(x, z, -.46, -.34, .2);

const N = Math.min(innerWidth, innerHeight) < 600 ? 62 : 104;
const verts = new Float32Array(N * N * 6), hs = [];
let lo = 1e9, hi = -1e9;
for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
  const h = loss(i / (N - 1) * 2 - 1, j / (N - 1) * 2 - 1); hs.push(h);
  lo = Math.min(lo, h); hi = Math.max(hi, h);
}
const STOPS = [[.1, 1, .78], [.28, .42, 1], [1, .3, .64], [1, .82, .45]];
for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
  const o = (j * N + i) * 6, h = hs[j * N + i], t = (h - lo) / (hi - lo) * (STOPS.length - 1.001), a = t | 0, f = t - a;
  verts[o] = i / (N - 1) * 2 - 1; verts[o + 1] = h; verts[o + 2] = j / (N - 1) * 2 - 1;
  for (let k = 0; k < 3; k++) verts[o + 3 + k] = (STOPS[a][k] + (STOPS[a + 1][k] - STOPS[a][k]) * f) * .42;
}
const idx = [];
for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
  if (i < N - 1) idx.push(j * N + i, j * N + i + 1);
  if (j < N - 1) idx.push(j * N + i, (j + 1) * N + i);
}
const gridBuf = gl.createBuffer(), idxBuf = gl.createBuffer(), trailBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, gridBuf); gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);

// Real optimizers racing downhill on the surface above.
const grad = (x, z) => { const e = .002; return [(loss(x + e, z) - loss(x - e, z)) / (2 * e), (loss(x, z + e) - loss(x, z - e)) / (2 * e)]; };
const OPT = [
  { name: "sgd", color: [1, 1, 1], step(o, g) { o.x -= .0022 * g[0]; o.z -= .0022 * g[1]; } },
  { name: "momentum", color: [1, .8, .25], step(o, g) { o.vx = .97 * o.vx - .0004 * g[0]; o.vz = .97 * o.vz - .0004 * g[1]; o.x += o.vx; o.z += o.vz; } },
  { name: "adam", color: [.25, 1, .76], step(o, g) {
    o.t++;
    for (const [p, i] of [["x", 0], ["z", 1]]) {
      o.m[i] = .9 * o.m[i] + .1 * g[i]; o.s[i] = .999 * o.s[i] + .001 * g[i] * g[i];
      o[p] -= .0026 * (o.m[i] / (1 - .9 ** o.t)) / (Math.sqrt(o.s[i] / (1 - .999 ** o.t)) + 1e-8);
    }
  } },
  { name: "rmsprop", color: [1, .36, .66], step(o, g) {
    for (const [p, i] of [["x", 0], ["z", 1]]) { o.s[i] = .95 * o.s[i] + .05 * g[i] * g[i]; o[p] -= .0017 * g[i] / (Math.sqrt(o.s[i]) + 1e-6); }
  } },
];
function restart() {
  const a = Math.random() * 6.283, r = .72 + Math.random() * .2, sx = Math.cos(a) * r, sz = Math.sin(a) * r;
  OPT.forEach(o => Object.assign(o, { x: sx, z: sz, vx: 0, vz: 0, t: 0, m: [0, 0], s: [0, 0], trail: [], age: 0 }));
  round = 0;
}
let round = 0;
restart();
const legend = $("legend");
legend.innerHTML = OPT.map((o, i) => '<li style="color:rgb(' + o.color.map(v => v * 255 | 0) + ')"><span>' + o.name + '</span><i id="l' + i + '"></i></li>').join("");

function advance() {
  round++;
  for (const o of OPT) {
    if (round > 620) break;
    o.step(o, grad(o.x, o.z));
    o.x = Math.max(-1, Math.min(1, o.x)); o.z = Math.max(-1, Math.min(1, o.z));
    if (round % 2 === 0) {
      o.trail.push(o.x, loss(o.x, o.z) + .012, o.z);
      if (o.trail.length > 900) o.trail.splice(0, 3);
    }
  }
  if (round > 760) restart();
}

let rot = .7, tRot = 0, tTilt = 0, mRot = 0, mTilt = 0, asp = 1, dpr = 1;
function size() {
  dpr = Math.min(devicePixelRatio || 1, 2) * RES[level];
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  gl.viewport(0, 0, c.width, c.height);
  asp = innerWidth / innerHeight;
}
addEventListener("resize", size);
addEventListener("pointermove", e => { tRot = (e.clientX / innerWidth - .5) * 1.6; tTilt = (e.clientY / innerHeight - .5) * .5; }, { passive: true });

const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
let last = 0, stepClock = 0;
function frame(t) {
  if (!still) requestAnimationFrame(frame);
  if (document.hidden) { last = t; return; }
  govern(t);
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  rot += dt * .09;
  mRot += (tRot - mRot) * .05; mTilt += (tTilt - mTilt) * .05;
  // Fixed 60 steps per second, so the race looks the same on 120 Hz screens.
  stepClock += dt * 60;
  while (stepClock >= 1) { advance(); stepClock--; }
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform1f(uRot, rot + mRot); gl.uniform1f(uTilt, .62 + mTilt); gl.uniform1f(uAsp, asp);
  gl.uniform1f(uZoom, Math.min(1.3, asp * 1.3));
  gl.bindBuffer(gl.ARRAY_BUFFER, gridBuf); bindLayout();
  gl.uniform1f(uSize, 1);
  gl.drawElements(gl.LINES, idx.length, gl.UNSIGNED_SHORT, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, trailBuf); bindLayout();
  OPT.forEach((o, i) => {
    const n = o.trail.length / 3, data = new Float32Array((n + 1) * 6);
    for (let k = 0; k < n; k++) {
      data.set([o.trail[k * 3], o.trail[k * 3 + 1], o.trail[k * 3 + 2], o.color[0], o.color[1], o.color[2]], k * 6);
    }
    data.set([o.x, loss(o.x, o.z) + .012, o.z, o.color[0], o.color[1], o.color[2]], n * 6);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
    gl.uniform1f(uSize, 2.6 * dpr);
    gl.drawArrays(gl.POINTS, 0, n);
    gl.uniform1f(uSize, 8 * dpr);
    gl.drawArrays(gl.POINTS, n, 1);
    if (round % 8 === 0) $("l" + i).textContent = (loss(o.x, o.z) - lo).toFixed(4);
  });
}
S.ready(() => { size(); requestAnimationFrame(frame); });
</script>
</body>
</html>
