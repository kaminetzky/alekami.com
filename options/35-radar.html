<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#010805">
<style>
html,body{height:100%;margin:0;background:#010805;color:#39ff88;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.info{position:fixed;left:max(16px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));font-size:11px;line-height:1.6;letter-spacing:.1em;color:#39ff88aa;pointer-events:none}
.info b{color:#39ff88;font-size:13px}
.links{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:10px}
a{color:#39ff88;border:1px solid #39ff88aa;background:#010805cc;padding:9px 16px;text-decoration:none;font-size:13px;letter-spacing:.12em}
a:hover,a:focus-visible{background:#39ff88;color:#010805}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="An air traffic control radar scope. Aircraft tracks painted by the rotating sweep trace this person's name."></canvas>
<div class="info"><b id="who"></b><br><span id="role"></span><br>APP RADAR · QNH 1013 · RWY 27</div>
<div class="links"><a id="gh" rel="me noopener">GITHUB</a><a id="li" rel="me noopener">LINKEDIN</a></div>
<script src="../config.js"></script>
<script src="letters.js"></script>
<script>
{
const S = SITE, $ = id => document.getElementById(id);
$("who").textContent = S.full.toUpperCase(); $("role").textContent = S.role.toUpperCase();
$("gh").href = S.github; $("li").href = S.linkedin;
const c = $("c"), x = c.getContext("2d");
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const PERIOD = 3.2, KEEP = 14, G = "57,255,136";
let W, H, dpr, cx, cy, R, targets = [], clutter = [];

// Aircraft fly up and down short legs of each letter stroke. Their radar history (one paint per sweep) traces the letters.
function layout() {
  W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2);
  c.width = W * dpr; c.height = H * dpr;
  R = Math.min(W * .47, (H - 120) * .5); cx = W / 2; cy = Math.max(R + 60, H / 2 - 10);
  // A round scope fits two lines best, so the surname gets its own line here (never split).
  const { strokes, width, height } = LETTERS.strokes(S.lines(true));
  const k = Math.min(R * 1.66 / width, R * 1.05 / height);
  targets = [];
  let n = 0;
  for (const poly of strokes) {
    const P = poly.map(([a, b]) => [cx + a * k, cy - b * k]), seg = [];
    let L = 0;
    for (let i = 1; i < P.length; i++) { const l = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); seg.push([P[i - 1], P[i], L, l]); L += l; }
    const count = Math.max(1, Math.round(L / (k * 1.1)));
    for (let j = 0; j < count; j++) {
      const a = L * j / count, b = L * (j + 1) / count;
      targets.push({ seg, a, b, u: a + Math.random() * (b - a), dir: Math.random() < .5 ? 1 : -1, speed: (b - a) / (PERIOD * (KEEP - 2)), hist: [], tag: n++ % 17 === 5, call: "AK" + (100 + Math.random() * 899 | 0), fl: (80 + Math.random() * 280 | 0) });
    }
  }
  // Weather and ground clutter scattered around the scope.
  clutter = Array.from({ length: 260 }, () => { const r = R * (.15 + Math.pow(Math.random(), .5) * .85), a = Math.random() * 6.2832; return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, hist: [] }; })
    .filter((p, i) => i < 60 || Math.hypot(p.x - (cx - R * .55), p.y - (cy + R * .45)) < R * .3);
}
const at = (t, u) => { for (const s of t.seg) if (u <= s[2] + s[3] || s === t.seg[t.seg.length - 1]) { const f = Math.max(0, Math.min(1, (u - s[2]) / s[3])); return [s[0][0] + (s[1][0] - s[0][0]) * f, s[0][1] + (s[1][1] - s[0][1]) * f]; } };
const bearing = (px, py) => (Math.atan2(px - cx, cy - py) + 6.2832) % 6.2832;

let sweep = 0;
function step(dt, t) {
  const prev = sweep; sweep = (sweep + dt / PERIOD * 6.2832) % 6.2832;
  const crossed = b => prev <= sweep ? b > prev && b <= sweep : b > prev || b <= sweep;
  for (const tg of targets) {
    tg.u += tg.dir * tg.speed * dt;
    if (tg.u > tg.b) { tg.u = tg.b; tg.dir = -1; } if (tg.u < tg.a) { tg.u = tg.a; tg.dir = 1; }
    const p = at(tg, tg.u);
    if (crossed(bearing(p[0], p[1]))) { tg.hist.push([p[0], p[1], t]); if (tg.hist.length > KEEP) tg.hist.shift(); }
  }
  for (const cl of clutter) if (crossed(bearing(cl.x, cl.y)) && Math.random() < .6) { cl.hist.push(t); if (cl.hist.length > 2) cl.hist.shift(); }
}
function draw(t) {
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.fillStyle = "#010805"; x.fillRect(0, 0, W, H);
  // Scope face: a faint green glass with range rings and bearing marks.
  const face = x.createRadialGradient(cx, cy, 0, cx, cy, R);
  face.addColorStop(0, "rgba(" + G + ",.06)"); face.addColorStop(1, "rgba(" + G + ",.015)");
  x.fillStyle = face; x.beginPath(); x.arc(cx, cy, R, 0, 6.3); x.fill();
  x.save(); x.beginPath(); x.arc(cx, cy, R, 0, 6.3); x.clip();
  x.strokeStyle = "rgba(" + G + ",.16)"; x.lineWidth = 1;
  for (let i = 1; i <= 5; i++) { x.beginPath(); x.arc(cx, cy, R * i / 5, 0, 6.3); x.stroke(); }
  for (let a = 0; a < 360; a += 30) { const r = a * Math.PI / 180; x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + Math.sin(r) * R, cy - Math.cos(r) * R); x.stroke(); }
  // Sweep with a fading wedge behind it.
  for (let i = 0; i < 28; i++) {
    const a0 = sweep - (i + 1) * .035, a1 = sweep - i * .035;
    x.fillStyle = "rgba(" + G + "," + (.16 * (1 - i / 28)) + ")";
    x.beginPath(); x.moveTo(cx, cy); x.arc(cx, cy, R, a0 - Math.PI / 2, a1 - Math.PI / 2); x.closePath(); x.fill();
  }
  x.strokeStyle = "rgba(" + G + ",.9)"; x.lineWidth = 1.5; x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + Math.sin(sweep) * R, cy - Math.cos(sweep) * R); x.stroke();
  // Clutter, then each aircraft's history, oldest faintest. The newest paint glows.
  for (const cl of clutter) for (const pt of cl.hist) { const a = Math.max(0, 1 - (t - pt) / (PERIOD * 2)); if (a > 0) { x.fillStyle = "rgba(" + G + "," + a * .25 + ")"; x.fillRect(cl.x - 1.5, cl.y - 1.5, 3, 3); } }
  const dot = Math.max(1.6, R / 170);
  for (const tg of targets) {
    tg.hist.forEach((h, i) => {
      const age = t - h[2], a = Math.max(0, 1 - age / (PERIOD * KEEP));
      if (a <= 0) return;
      const last = i === tg.hist.length - 1;
      x.fillStyle = "rgba(" + G + "," + (last ? Math.max(.55, 1 - age / PERIOD) : a * .75) + ")";
      x.beginPath(); x.arc(h[0], h[1], last ? dot * 1.5 : dot, 0, 6.3); x.fill();
    });
  }
  // Data blocks on a few aircraft, with a leader line.
  x.font = Math.max(9, Math.min(11, R / 34)) + "px ui-monospace,Menlo,monospace"; x.textBaseline = "top";
  for (const tg of targets) {
    if (!tg.tag || !tg.hist.length) continue;
    const h = tg.hist[tg.hist.length - 1], a = Math.max(0, 1 - (t - h[2]) / (PERIOD * 1.2));
    if (a <= 0) continue;
    x.strokeStyle = x.fillStyle = "rgba(" + G + "," + (.35 + .5 * a) + ")";
    x.beginPath(); x.moveTo(h[0] + 3, h[1] - 3); x.lineTo(h[0] + 14, h[1] - 14); x.stroke();
    x.fillText(tg.call, h[0] + 16, h[1] - 26); x.fillText(String(tg.fl).padStart(3, "0") + " 12", h[0] + 16, h[1] - 14);
  }
  x.restore();
  // Bezel: bearing numbers round the rim.
  x.strokeStyle = "rgba(" + G + ",.5)"; x.lineWidth = 2; x.beginPath(); x.arc(cx, cy, R, 0, 6.3); x.stroke();
  x.fillStyle = "rgba(" + G + ",.7)"; x.font = "10px ui-monospace,Menlo,monospace"; x.textAlign = "center"; x.textBaseline = "middle";
  for (let a = 0; a < 360; a += 10) {
    const r = a * Math.PI / 180, l = a % 30 ? 4 : 8;
    x.beginPath(); x.moveTo(cx + Math.sin(r) * R, cy - Math.cos(r) * R); x.lineTo(cx + Math.sin(r) * (R + l), cy - Math.cos(r) * (R + l)); x.stroke();
    if (a % 30 === 0 && R > 140) x.fillText(String(a).padStart(3, "0"), cx + Math.sin(r) * (R + 18), cy - Math.cos(r) * (R + 18));
  }
  x.textAlign = "left";
}
let last = 0, clock = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = now; return; }
  const dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;
  step(dt, clock); draw(clock);
}
// Reduced motion: run the scope for a while offscreen, then show one still frame.
function settle() { for (let t = 0; t < PERIOD * KEEP; t += 1 / 30) step(1 / 30, t); clock = PERIOD * KEEP; draw(clock); }
addEventListener("resize", () => { layout(); if (still) settle(); });
S.ready(() => { layout(); if (still) settle(); else requestAnimationFrame(frame); });
}
</script>
</body>
</html>
