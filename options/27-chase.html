<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07061a">
<style>
html,body{height:100%;margin:0;background:#07061a;color:#7dff9b;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{cursor:grab}
#hud:active{cursor:grabbing}
.panel{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(100% - 24px,640px);pointer-events:none;text-align:center}
h1{margin:0;font-size:clamp(16px,2.2vw,30px);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#d4ffe0;text-shadow:0 0 14px #2dff6e,0 1px 3px #000}
.role{margin:0;font-size:clamp(10px,1.05vw,13px);letter-spacing:.12em;color:#ffcf6a;text-shadow:0 1px 3px #000}
.radio{display:flex;gap:10px;pointer-events:auto;width:100%;justify-content:center}
a{flex:0 1 230px;color:#ffcf6a;background:#070a0cdd;border:1px solid #7dff9b66;text-decoration:none;padding:9px 10px;font-size:clamp(11px,1.1vw,13px);font-weight:700;letter-spacing:.06em;white-space:nowrap}
a:hover,a:focus-visible{background:#7dff9b;color:#04140a}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<canvas id="hud" aria-label="Chase view of a small plane flying through drone formations of this person's name and fields. Drag to fly."></canvas>
<div class="panel">
  <h1 id="name"></h1>
  <p class="role" id="role"></p>
  <div class="radio">
    <a id="gh" rel="me noopener">GITHUB</a>
    <a id="li" rel="me noopener">LINKEDIN</a>
  </div>
</div>
<script src="../config.js"></script>
<script src="shapes.js"></script>
<script src="flight.js"></script>
<script src="drone-sim.js"></script>
<script src="fleet.js"></script>
<script>
{
const S = SITE, FL = FLIGHT, DEG = FL.DEG, $ = id => document.getElementById(id);
$("name").textContent = S.full; $("role").textContent = "CHASE VIEW · THE FLEET'S BRAIN TRAINS IN YOUR BROWSER";
$("gh").href = S.github; $("li").href = S.linkedin;
const c = $("c"), gl = c.getContext("webgl", { antialias: true, alpha: false, powerPreference: "high-performance" });
if (!gl) { S.noWebGL(); throw new Error("WebGL unavailable"); }
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const RES = [.55, .8, 1], tier = S.tier(gl), small = Math.min(innerWidth, innerHeight) < 600;
let level = tier;
const govern = S.governor(level, l => { level = l; size(); });
const world = FL.scene(gl, [84, 120, small ? 110 : 170][tier]);
const F = FL.aircraft(), fleet = FLEET.create(gl, world, [300, 700, small ? 900 : 1400][tier]);
const hud = $("hud"), h = hud.getContext("2d"), st = FL.stick(hud, F);

// The chase camera trails the aircraft. It follows heading and pitch with a little lag and only part of the bank, so you see the plane roll.
const C = { x: 0, alt: 0, z: 0, psi: 0, theta: 0, phi: 0 };
function chase(dt) {
  const k = Math.min(1, dt * 2.2);
  C.psi = FL.wrap(C.psi + FL.wrap(F.psi - C.psi) * k);
  C.theta += (F.theta * .5 - 13 * DEG - C.theta) * k; C.phi += (F.phi * .3 - C.phi) * k;
  const back = 104;
  C.x = F.x - Math.sin(C.psi) * back; C.z = F.z - Math.cos(C.psi) * back;
  C.alt = Math.max(F.alt + 44 - Math.sin(F.theta) * back * .6, FL.terrain(C.x, C.z) + 10);
}

// Wireframe aircraft, high wing, in its own axes: x right, y up, z forward.
const MODEL = [
  [0, 0, 10, 0, 1.6, 4], [0, 1.6, 4, 0, 1.4, -3], [0, 1.4, -3, 0, .5, -14], [0, 0, 10, 0, -1.2, 3], [0, -1.2, 3, 0, .5, -14],
  [0, 0, 10, -1.1, .3, 4], [-1.1, .3, 4, -.9, .4, -4], [-.9, .4, -4, 0, .5, -14], [0, 0, 10, 1.1, .3, 4], [1.1, .3, 4, .9, .4, -4], [.9, .4, -4, 0, .5, -14],
  [0, 1.6, 2.5, -15, 1.7, 1.4], [-15, 1.7, 1.4, -15, 1.7, -.6], [-15, 1.7, -.6, 0, 1.6, -1.6],
  [0, 1.6, 2.5, 15, 1.7, 1.4], [15, 1.7, 1.4, 15, 1.7, -.6], [15, 1.7, -.6, 0, 1.6, -1.6],
  [-5, .5, -12.6, 0, .5, -10], [0, .5, -10, 5, .5, -12.6], [5, .5, -12.6, -5, .5, -12.6],
  [0, .5, -14, 0, 4.6, -14.6], [0, 4.6, -14.6, 0, 1.4, -10], [-3, .2, 10.2, 3, .2, 10.2],
];
// Each segment is drawn three times, nudged, so the 1 px lines read as a bolder stroke.
const SCALE = 2.3, NUDGE = [[0, 0], [.22, 0], [0, .22]], modelData = new Float32Array(MODEL.length * 14 * NUDGE.length), lights = new Float32Array(4 * 7);
const TRAIL = 70, trail = [], trailData = new Float32Array((TRAIL - 1) * 2 * 2 * 7);
function buildModel(t) {
  const b = FL.basis(F), at = (x, y, z, out, o) => {
    x *= SCALE; y *= SCALE; z *= SCALE;
    out[o] = F.x + b.right[0] * x + b.up[0] * y + b.fw[0] * z;
    out[o + 1] = F.alt + b.right[1] * x + b.up[1] * y + b.fw[1] * z;
    out[o + 2] = F.z + b.right[2] * x + b.up[2] * y + b.fw[2] * z;
  };
  NUDGE.forEach(([nx, ny], k) => MODEL.forEach((m, i) => {
    const o = (k * MODEL.length + i) * 14;
    at(m[0] + nx, m[1] + ny, m[2], modelData, o); at(m[3] + nx, m[4] + ny, m[5], modelData, o + 7);
    for (const q of [o + 3, o + 10]) { modelData[q] = 1; modelData[q + 1] = .82; modelData[q + 2] = .45; modelData[q + 3] = .9; }
  }));
  // Navigation lights: red left, green right, a white tail strobe and a landing light.
  const L = [[-15, 1.7, .4, 1, .15, .2, 1], [15, 1.7, .4, .2, 1, .4, 1], [0, 4.6, -14.6, 1, 1, 1, (t % 1.2) < .08 ? 2 : 0], [0, -.4, 9, 1, .9, .7, .7]];
  L.forEach((l, i) => { at(l[0], l[1], l[2], lights, i * 7); lights.set(l.slice(3), i * 7 + 3); });
  // Wingtip vortex trails.
  const tipL = [0, 0, 0], tipR = [0, 0, 0];
  at(-15, 1.7, -.6, tipL, 0); at(15, 1.7, -.6, tipR, 0);
  trail.unshift([tipL, tipR]); if (trail.length > TRAIL) trail.pop();
  let o = 0;
  for (let i = 0; i < trail.length - 1; i++) for (let s = 0; s < 2; s++) {
    const a = (1 - i / TRAIL) * .5, b2 = (1 - (i + 1) / TRAIL) * .5;
    trailData.set(trail[i][s], o); trailData.set([.6, .9, 1, a], o + 3); o += 7;
    trailData.set(trail[i + 1][s], o); trailData.set([.6, .9, 1, b2], o + 3); o += 7;
  }
  return o;
}

let W, H, aspect = 1;
function size() {
  W = innerWidth; H = innerHeight; aspect = W / H;
  const dpr = Math.min(devicePixelRatio || 1, small ? 1.5 : 1.75) * RES[level];
  c.width = W * dpr; c.height = H * dpr; gl.viewport(0, 0, c.width, c.height);
  hud.width = W * Math.min(devicePixelRatio || 1, 2); hud.height = H * Math.min(devicePixelRatio || 1, 2);
}

let clock = 0;
function simulate(dt) {
  const aim = fleet.aim(F);
  FL.fly(F, dt, st.hand ? st.want(dt) : FL.autopilot(F, dt, aim.psi, aim.alt));
  fleet.flythrough(F, dt, clock, 3000, .9, st.hand);
  fleet.step(dt, F, fleet.shape().hue);
  chase(dt);
}
function draw() {
  const cam = FL.basis(C), R = world.render(C, cam, aspect), ctx = { R, P: C, aspect, height: c.height };
  fleet.render(ctx);
  const n = buildModel(clock);
  if (n) fleet.extra(ctx, trailData.subarray(0, n), true);
  fleet.extra(ctx, modelData, true);
  fleet.extra(Object.assign({ size: 3 }, ctx), lights, false);
  const tight = W < 560, f = fleet;
  const mode = st.hand ? "HAND FLYING"
    : !f.brain ? "AUTOPILOT · FLEET BRAIN BOOTING"
    : f.trained ? (tight ? "AUTOPILOT · FLEET TRAINED HERE" : "AUTOPILOT · FLEET TRAINED ON THIS DEVICE · " + FL.FLY)
    : (tight ? "" : "FLEET BRAIN ") + "LEARNING · GEN " + f.gen + " · " + (f.err > 50 ? "CRASHING" : f.err.toFixed(2) + " M");
  FL.hud(hud, h, W, H, F, mode, st.hand || (f.brain && !f.trained) ? FL.AMBER : FL.GREEN, st, { ladder: false });
  const sh = f.shape(), O = f.O, tag = FL.project(cam, C, O.x, O.y + sh.h / 2 * f.K + 70, O.z, W, H);
  if (!O.passed && sh.cap && tag.z > 300 && tag.x > 20 && tag.x < W - 20 && tag.y > 70 && tag.y < H - 20) {
    h.fillStyle = "#ff77d0"; h.font = "bold 12px ui-monospace,Menlo,monospace"; h.textAlign = "center"; h.textBaseline = "alphabetic";
    h.fillText(sh.cap, tag.x, tag.y);
  }
}
let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = t; return; }
  govern(t);
  const dt = Math.min(.05, (t - last) / 1000); last = t; clock += dt;
  simulate(dt); draw();
}
let rt, bw = innerWidth;
addEventListener("resize", () => {
  size(); if (still) draw();
  if (innerWidth === bw) return;
  bw = innerWidth; clearTimeout(rt);
  rt = setTimeout(() => { fleet.build(innerWidth / innerHeight < 1); fleet.assign(fleet.shape()); }, 150);
});
S.ready(() => {
  bw = innerWidth; size(); fleet.build(innerWidth / innerHeight < 1);
  fleet.anchorAhead(F, 3000, 0);
  fleet.drones.forEach(fleet.park);
  chase(1);
  if (still) {
    fleet.drones.forEach(d => { d.x = d.tx; d.y = d.ty; d.s = 0; });
    const O = fleet.O; F.x = O.x - O.ax * 1500; F.z = O.z - O.az * 1500; F.alt = O.y; chase(1);
    draw();
  } else { fleet.train(); requestAnimationFrame(frame); }
});
}
</script>
</body>
</html>
