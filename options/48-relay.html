<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07061a">
<style>
html,body{height:100%;margin:0;background:#07061a;color:#7dff9b;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{cursor:grab}
#hud:active{cursor:grabbing}
.panel{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(100% - 24px,640px);pointer-events:none;text-align:center}
h1{margin:0;font-size:clamp(16px,2.2vw,30px);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#d4ffe0;text-shadow:0 0 14px #2dff6e,0 1px 3px #000}
.role{margin:0;font-size:clamp(10px,1.05vw,13px);letter-spacing:.12em;color:#ffcf6a;text-shadow:0 1px 3px #000;text-wrap:balance}
.radio{display:flex;gap:10px;pointer-events:auto;width:100%;justify-content:center}
a{flex:0 1 230px;color:#ffcf6a;background:#070a0cdd;border:1px solid #7dff9b66;text-decoration:none;padding:9px 10px;font-size:clamp(11px,1.1vw,13px);font-weight:700;letter-spacing:.06em;white-space:nowrap}
a:hover,a:focus-visible{background:#7dff9b;color:#04140a}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<canvas id="hud" aria-label="Two drone fleets take turns: while the aircraft flies through one formation, the next is already waiting behind it. Drag to hand fly."></canvas>
<div class="panel">
  <h1 id="name"></h1>
  <p class="role" id="role"></p>
  <div class="radio">
    <a id="gh" rel="me noopener">GITHUB</a>
    <a id="li" rel="me noopener">LINKEDIN</a>
  </div>
</div>
<script src="../config.js"></script>
<script src="shapes.js"></script>
<script src="flight.js"></script>
<script src="drone-sim.js"></script>
<script src="brain.js"></script>
<script src="fleet.js"></script>
<script src="formation-kit.js"></script>
<script>
{
// Two fleets in relay. While you fly through one formation the other already waits beyond it,
// and the fleet you just passed leapfrogs ahead with the next shape.
const FL = FLIGHT;
let seq = 0, offT = 0;
const at = O => ({ x: O.x, z: O.z, alt: O.y });
// Each formation sits off to alternating sides of the one before, so the next is in view beside it, not hidden behind.
const side = () => (seq % 2 ? .45 : -.45);
function place(K, f, base, psi) { f.index = seq++ % f.shapes.length; f.anchorAhead(base, K.dist, psi); }
FORMKIT.start({
  tagline: "TWO DRONE FLEETS IN RELAY · THE NEXT FORMATION IS ALREADY WAITING",
  fleets: 2, N: [150, 350, 450, 700],
  start(K) { const [A, B] = K.fleets; seq = 0; place(K, A, K.F, 0); place(K, B, at(A.O), side()); },
  simulate(K, dt) {
    const F = K.F, st = K.st, [A, B] = K.fleets;
    const next = [A, B].filter(f => !f.O.passed).sort((a, b) => a.plane(F).dist - b.plane(F).dist)[0];
    const aim = next ? next.aim(F) : { psi: F.psi };
    FL.fly(F, dt, st.hand ? st.want(dt) : FL.autopilot(F, dt, aim.psi, aim.alt));
    for (const f of [A, B]) {
      const O = f.O, other = f === A ? B : A;
      if (!O.passed && f.plane(F).ps > 30) { O.passed = true; O.passT = K.clock; O.passAlt = F.alt; }
      if (O.passed && K.clock - O.passT > .55) {
        if (other.O.passed) place(K, f, F, F.psi);
        else place(K, f, at(other.O), other.O.psi + (st.hand ? 0 : side()));
      }
      f.step(dt, F, f.shape().hue);
    }
    // Flown away from the next formation for a while: lay both out ahead again.
    if (next) {
      const off = Math.abs(FL.wrap(Math.atan2(next.O.x - F.x, next.O.z - F.z) - F.psi)) > 1.4 || next.plane(F).dist > K.dist * 3.6;
      offT = off ? offT + dt : 0;
      if (offT > 2.5) { offT = 0; const other = next === A ? B : A; place(K, next, F, F.psi); place(K, other, at(next.O), F.psi + side()); }
    }
  },
});
}
</script>
</body>
</html>
