<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f8fd8">
<style>
html,body{height:100%;margin:0;background:#6aa6e6;overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px max(18px,env(safe-area-inset-bottom));pointer-events:none;text-align:center}
h1{margin:0;font-size:clamp(13px,1.4vw,17px);font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#fff;text-shadow:0 1px 2px #1d3d2088}
.links{display:flex;gap:10px;pointer-events:auto}
a{color:#17324f;background:#ffffffe6;padding:10px 18px;border-radius:999px;text-decoration:none;font-weight:700;font-size:14px;box-shadow:0 2px 10px #0003}
a:hover,a:focus-visible{background:#17324f;color:#fff}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="A clear blue sky where a formation of small planes types this person's name in puffs of white smoke"></canvas>
<div class="ui"><h1 id="role"></h1><div class="links"><a id="gh" rel="me noopener">GitHub</a><a id="li" rel="me noopener">LinkedIn</a></div></div>
<script src="../config.js"></script>
<script src="letters.js"></script>
<script>
{
const S = SITE, $ = id => document.getElementById(id);
$("role").textContent = S.role + " · Pilot"; $("gh").href = S.github; $("li").href = S.linkedin;
const c = $("c"), x = c.getContext("2d");
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
let W, H, dpr, sp, rows = [], puffs = [], clouds = [], t0 = 0, pointer = { x: -1e4, y: -1e4 };

// One soft smoke puff, drawn once and stamped everywhere.
const puff = document.createElement("canvas"); puff.width = puff.height = 96;
{ const g = puff.getContext("2d"), r = g.createRadialGradient(42, 40, 2, 48, 48, 48);
  r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(.45, "rgba(250,252,255,.9)"); r.addColorStop(.75, "rgba(225,233,245,.45)"); r.addColorStop(1, "rgba(220,230,245,0)");
  g.fillStyle = r; g.fillRect(0, 0, 96, 96); }

// Lay out the text: each line is a pass of the formation, typed left to right. The surname always stays on one line.
function layout() {
  W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2);
  c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const lines = S.lines(W / H < 1).map(l => LETTERS.dots(l));
  const widest = Math.max(...lines.map(l => l.length));
  sp = Math.min(W * .9 / widest, H * .055);
  const blockH = lines.length * 7 * sp + (lines.length - 1) * 3 * sp, top = H * .36 - blockH / 2;
  rows = lines.map((cols, i) => ({ cols, left: (W - cols.length * sp) / 2, top: top + i * 10 * sp }));
  clouds = Array.from({ length: 6 }, (_, i) => ({ x: Math.random() * W, y: H * (.08 + Math.random() * .55), s: .6 + Math.random() * .9, v: 4 + Math.random() * 6 }));
}

// The planes fly at constant speed; a pass types one line, then the formation comes round for the next.
const SPEED = () => Math.max(120, W / 7);
function passOf(t) {
  let at = t;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i], len = (r.cols.length * sp + W * .3 + 200) / SPEED();
    if (at < len) return { i, s: at * SPEED() - 100 - W * .15 };
    at -= len;
  }
  return null;
}
let typed = [];
function emit(t) {
  const p = passOf(t);
  if (!p) return null;
  const r = rows[p.i], col = Math.floor((p.s - r.left) / sp);
  // Each column puffs once, as the formation's tails pass it.
  for (let ci = typed[p.i] === undefined ? 0 : typed[p.i] + 1; ci <= col && ci < r.cols.length; ci++) {
    if (ci >= 0) r.cols[ci].forEach((on, row) => {
      if (on) puffs.push({ x: r.left + (ci + .5) * sp, y: r.top + (row + .5) * sp, born: t, vx: 0, vy: 0, j: Math.random() });
    });
    typed[p.i] = ci;
  }
  return p;
}

function plane(px, py, s) {
  x.save(); x.translate(px, py); x.scale(s, s);
  x.fillStyle = "#24364f";
  x.beginPath(); x.ellipse(0, 0, 9, 1.6, 0, 0, 6.3); x.fill();
  x.beginPath(); x.moveTo(2, 0); x.lineTo(-1, -8); x.lineTo(-3, -8); x.lineTo(-2, 0); x.lineTo(-3, 8); x.lineTo(-1, 8); x.closePath(); x.fill();
  x.beginPath(); x.moveTo(-7, 0); x.lineTo(-9, -3.4); x.lineTo(-10, -3.4); x.lineTo(-9.4, 0); x.lineTo(-10, 3.4); x.lineTo(-9, 3.4); x.closePath(); x.fill();
  x.restore();
}
function draw(t, dt) {
  // Sky: deep blue overhead, paler toward the horizon, with the sun off to one side.
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#2f6fc4"); g.addColorStop(.6, "#78b2ec"); g.addColorStop(1, "#cfe6fa");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const sun = x.createRadialGradient(W * .86, H * .12, 0, W * .86, H * .12, Math.max(W, H) * .5);
  sun.addColorStop(0, "rgba(255,252,235,.95)"); sun.addColorStop(.05, "rgba(255,248,220,.6)"); sun.addColorStop(1, "rgba(255,248,220,0)");
  x.fillStyle = sun; x.fillRect(0, 0, W, H);
  // Clouds drift slowly behind the smoke.
  for (const cl of clouds) {
    const cx = (cl.x + t * cl.v) % (W + 400) - 200;
    x.globalAlpha = .55;
    for (let k = 0; k < 7; k++) { const r = 70 * cl.s * (1 - Math.abs(k - 3) / 6); x.drawImage(puff, cx + (k - 3) * 38 * cl.s - r, cl.y - r * .7 - (k % 2) * 10 * cl.s, r * 2, r * 1.6); }
  }
  x.globalAlpha = 1;
  // Smoke: each puff swells, drifts with the wind and slowly dissolves. A pointer blows it around.
  const wind = sp * .06;
  for (const p of puffs) {
    const age = t - p.born, dx = p.x - pointer.x, dy = p.y - pointer.y, q = dx * dx + dy * dy;
    if (q < 6400) { const d = Math.sqrt(q) + 1, k = (1 - d / 80) * 1400 * dt; p.vx += dx / d * k; p.vy += dy / d * k; }
    p.vx *= Math.exp(-dt * 2); p.vy *= Math.exp(-dt * 2); p.x += p.vx * dt; p.y += p.vy * dt;
    const r = sp * (.42 + .5 * (1 - Math.exp(-age / 2.2)) + age * .012), a = Math.min(1, age * 5) * (1 - Math.min(1, Math.max(0, (age - 16) / 12)));
    if (a <= 0) continue;
    x.globalAlpha = a * .95;
    x.drawImage(puff, p.x + wind * age + Math.sin(age * .7 + p.j * 6) * sp * .08 - r, p.y - age * sp * .02 - r, r * 2, r * 2);
  }
  x.globalAlpha = 1;
  puffs = puffs.filter(p => t - p.born < 28);
  // The formation: seven planes line abreast, one per dot row.
  const p = passOf(t);
  if (p) { const r = rows[p.i]; for (let row = 0; row < 7; row++) plane(p.s + sp * .7, r.top + (row + .5) * sp, sp / 14); }
  // Ground: a line of trees and a field, as if you were lying in the grass looking up.
  x.fillStyle = "#2f5d3a";
  x.beginPath(); x.moveTo(0, H);
  for (let i = 0; i <= 60; i++) { const px = i / 60 * W; x.lineTo(px, H * .93 - Math.abs(Math.sin(i * 1.7) * Math.sin(i * .37)) * H * .05); }
  x.lineTo(W, H); x.fill();
  x.fillStyle = "#24492e"; x.fillRect(0, H * .965, W, H * .04);
}
let last = 0, clock = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = now; return; }
  const dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;
  emit(clock - t0);
  // When everything has been typed and has mostly drifted away, type it again.
  if (!passOf(clock - t0) && puffs.length === 0) { t0 = clock; typed = []; }
  draw(clock - t0, dt);
}
addEventListener("pointermove", e => { pointer.x = e.clientX; pointer.y = e.clientY; }, { passive: true });
addEventListener("pointerleave", () => { pointer.x = pointer.y = -1e4; });
addEventListener("resize", () => { layout(); puffs = []; typed = []; t0 = clock; if (still) settle(); });
function settle() { typed = []; for (let t = 0; t < 60; t += .05) if (!emit(t)) break; puffs.forEach(p => p.born = -3); draw(0, 0); }
S.ready(() => { layout(); if (still) settle(); else requestAnimationFrame(frame); });
}
</script>
</body>
</html>
